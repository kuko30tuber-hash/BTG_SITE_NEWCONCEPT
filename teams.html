<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Teams</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<style>
/* ── TFG base tokens (mirror drivers.html) ─────────────────────────────── */
:root {
  --bg-base: #18181b;
  --bg-card: #0e0e12;
  --bg-card-hover: #131318;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.14);
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --text-disabled: #52525b;
  --accent: #dc2626;
  --accent-light: #f87171;
  --accent-dark: #7f1d1d;
  --accent-bg: rgba(220,38,38,0.08);
  --accent-border: rgba(220,38,38,0.25);
  --accent-rgb: 220 38 38;
  --accent-light-rgb: 248 113 113;
  --accent-dark-rgb: 127 29 29;
  /* The interface-wide default for anything painted in a team's colour. A card that resolves no team takes the
     theme's own accent, so switching theme changes the fallback everywhere instead of leaving one hard-coded
     purple behind. Components that do know a team still set `--team-rgb` inline and win over this. */
  --team-rgb: 220 38 38;
  --theme-secondary: #f59e0b;
  --theme-secondary-rgb: 245 158 11;
  --base-rgb: 24 24 27;
  --deep-rgb: 14 14 18;
  --card-rgb: 14 14 18;
  --card-hover-rgb: 19 19 24;
  --raised-rgb: 19 19 24;
  --surface-raised: #131318;
  --header-rgb: 16 16 20;
  --font-mono: ui-monospace, Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono',
    'Roboto Mono', 'Oxygen Mono', 'Ubuntu Monospace', 'Source Code Pro',
    'Fira Mono', 'Droid Sans Mono', 'Courier New', monospace;
}

/* A team's mark and a car's number are both drawn in the team's own colour, so each carries a shadow that keeps its
   edge readable wherever it is laid — on a dark page, or on a band of the colour it is drawn in. */
.team-logo { filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
.team-logo--auto-white { filter: brightness(0) invert(1) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
.team-logo--auto-black { filter: brightness(0) drop-shadow(0 1px 2px rgba(255, 255, 255, 0.28)); }

@font-face {
  font-family: 'Formula1';
  src: url('fonts/AlfaqixDiode-SemiBold.otf') format('opentype');
  font-weight: 600;
  font-display: swap;
}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at top left, rgba(var(--accent-rgb) / 0.12), transparent 32%),
    radial-gradient(circle at 85% 12%, rgba(var(--theme-secondary-rgb) / 0.10), transparent 28%),
    linear-gradient(180deg, rgba(var(--theme-secondary-rgb) / 0.025), transparent 20%);
}

/* ── TFG Layout ─────────────────────────────────────────────────────────── */
.dp-layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 120px); max-width: 1400px; margin: 0 auto; transition: grid-template-columns 0.25s ease; }
.dp-layout.sb-collapsed { grid-template-columns: 0 1fr; }
.dp-layout.sb-collapsed .dp-picker { border-right: 0; }
/* The list is a column of evenly spaced shapes: the same gap between a team's line and its drivers, and between one
   team and the next. */
.dp-picker { display: flex; flex-direction: column; gap: 4px; background: #0d0d0f; border-right: 1px solid var(--border-subtle); padding: 10px 0; overflow-y: auto; max-height: calc(100vh - 120px); position: sticky; top: 56px; min-width: 0; }
.dp-picker__title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-disabled); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dp-picker__toggle { border: 1px solid var(--border-subtle); background: transparent; color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4; flex: none; }
.dp-picker__toggle:hover { color: var(--text-primary); border-color: var(--border-medium); }
.dp-picker__group { display: flex; flex-direction: column; gap: 4px; }
/* A team's own line, shaped like the chips under it: rounded, inset, and carrying the accent border the rail rows
   carry. It is filled with the team's colours and the flag at its end takes the ink that reads on them. */
.dp-picker__team { display: flex; align-items: center; gap: 6px; width: calc(100% - 12px); margin: 0 6px; padding: 4px 12px; border: 1px solid rgb(var(--accent-rgb) / 0.5); border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.dp-picker__team-flag { width: 19px; height: 13px; flex: 0 0 auto; margin-left: auto; object-fit: cover; border: 1px solid rgb(0 0 0 / 0.3); }
/* The chip carries the team's colours and the number sits on the end of them without its own plate, so the height is
   the same whichever driver is in it. Its shape is the rail row's: rounded, inset from the list, under the same border. */
#sb-list { display: flex; flex-direction: column; gap: 4px; }
.dp-picker__chip { display: flex; align-items: center; gap: 10px; width: calc(100% - 20px); margin: 0 10px; min-height: 52px; padding: 8px 14px; border: 1px solid rgb(255 255 255 / 0.12); border-radius: 10px; background: transparent; color: #fff; cursor: pointer; font-size: 12px; font-weight: 500; text-shadow: 0 1px 2px rgb(0 0 0 / 0.35); text-align: left; transition: filter 100ms; }
.dp-picker__chip:hover { filter: brightness(1.08); }
.dp-picker__chip--active { font-weight: 600; box-shadow: inset 0 0 0 2px #fff; }
.dp-picker__chip:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.dp-picker__logo { display: flex; align-items: center; justify-content: center; width: 30px; height: 34px; flex: 0 0 30px; }
.dp-picker__logo img { width: 30px; height: 30px; object-fit: contain; filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.5)); }
.dp-picker__name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-sidebar-toggle { position: fixed; left: 8px; bottom: 12px; z-index: 65; border: 1px solid var(--border-subtle); background: rgb(var(--card-rgb)); color: var(--text-muted); font-size: 10px; font-family: var(--font-mono); padding: 5px 9px; border-radius: 4px; cursor: pointer; }
.dp-sidebar-toggle:hover { color: var(--text-primary); }

/* ── TFG Cards (glow via --team-rgb) ────────────────────────────────────── */
.dp-main { display: grid; grid-template-columns: 1fr 1.1fr 0.9fr; gap: 12px; padding: 12px; overflow-y: auto; }
@media (max-width: 1100px) { .dp-main { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .dp-main { grid-template-columns: 1fr; } }
.dp-left, .dp-center, .dp-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.dp-card {
  border: 1px solid rgb(var(--team-rgb, var(--accent-rgb)) / 0.35);
  border-radius: 6px;
  background: #161618;
  box-shadow: 0 0 8px rgb(var(--team-rgb, var(--accent-rgb)) / 0.08);
  position: relative;
  overflow: visible;
  transition: border-color 0.2s, box-shadow 0.2s;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.dp-card::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 10px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
  box-shadow:
    0 0 8px 2px rgb(var(--team-rgb, var(--accent-rgb)) / 0.25),
    0 0 18px 5px rgb(var(--team-rgb, var(--accent-rgb)) / 0.1);
  mask-image:
    conic-gradient(
      from var(--cursor-angle, 45deg) at center,
      black 0deg, transparent 60deg, transparent 300deg, black 360deg
    );
}
.dp-card:hover {
  border-color: rgb(var(--team-rgb, var(--accent-rgb)) / 0.55);
  box-shadow: 0 0 14px rgb(var(--team-rgb, var(--accent-rgb)) / 0.14);
}
.dp-card__title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 10px; }

/* ── Controls bar ───────────────────────────────────────────────────────── */
.dp-controls { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border-subtle); flex-wrap: wrap; margin-bottom: 12px; }
.dp-controls .label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.dp-controls select { background: #3a3a3a; border: 1px solid #4d4d4d; color: #ffffff; font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
.dp-controls select option { background: #3a3a3a; color: #ffffff; }
.dp-spacer { flex: 1; }
.series-tab { transition: color .15s, box-shadow .15s, border-color .15s; }
.series-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--series-color, var(--accent));
  box-shadow:
    0 0 10px color-mix(in srgb, var(--series-color, var(--accent)) 40%, transparent),
    inset 0 0 6px color-mix(in srgb, var(--series-color, var(--accent)) 20%, transparent);
}

/* ── Hero full logo (logos/full/{year}/{DB name}) — no placeholder ──────── */
.tp-banner { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
.tp-banner img { width: 100%; height: 100%; max-height: 200px; object-fit: contain; }

/* ── Tailwind-style utilities used by the ported markup ─────────────────── */
.flex{display:flex}.inline-flex{display:inline-flex}.grid{display:grid}
.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.justify-center{justify-content:center}
.text-center{text-align:center}.text-right{text-align:right}.text-left{text-align:left}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gap-0.5{gap:2px}.gap-1{gap:4px}.gap-1.5{gap:6px}.gap-2{gap:8px}.gap-3{gap:12px}
.rounded{border-radius:4px}.rounded-full{border-radius:9999px}
.border{border-width:1px}.border-2{border-width:2px}
.border-t{border-top-width:1px}.border-b{border-bottom-width:1px}
.border-white\/10{border-color:rgba(255,255,255,0.10)}
.border-white\/5{border-color:rgba(255,255,255,0.05)}
.border-amber-400\/20{border-color:rgba(251,191,36,0.20)}
.bg-white\/\[0.01\]{background:rgba(255,255,255,0.01)}
.bg-white\/\[0.02\]{background:rgba(255,255,255,0.02)}
.bg-white\/10{background:rgba(255,255,255,0.10)}
.bg-amber-500\/10{background:rgba(245,158,11,0.10)}
.bg-red-500\/15{background:rgba(239,68,68,0.15)}
.bg-black\/20{background:rgba(0,0,0,0.20)}
.p-1.5{padding:6px}.p-2{padding:8px}.p-3{padding:12px}
.px-2{padding-left:8px;padding-right:8px}.px-2.5{padding-left:10px;padding-right:10px}.px-3{padding-left:12px;padding-right:12px}
.py-0.5{padding-top:2px;padding-bottom:2px}.py-1{padding-top:4px;padding-bottom:4px}.py-1.5{padding-top:6px;padding-bottom:6px}.py-2{padding-top:8px;padding-bottom:8px}.py-4{padding-top:16px;padding-bottom:16px}.py-8{padding-top:32px;padding-bottom:32px}
.mt-0.5{margin-top:2px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.ml-1{margin-left:4px}.mr-1{margin-right:4px}
.text-xs{font-size:12px}.text-sm{font-size:14px}.text-base{font-size:16px}.text-lg{font-size:18px}
.text-\[8px\]{font-size:8px}.text-\[9px\]{font-size:9px}.text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.font-extrabold{font-weight:800}
.font-mono{font-family:var(--font-mono)}
.uppercase{text-transform:uppercase}
.tracking-wider{letter-spacing:0.05em}.tracking-\[0.04em\]{letter-spacing:0.04em}.tracking-\[0.14em\]{letter-spacing:0.14em}.tracking-\[0.08em\]{letter-spacing:0.08em}
.text-white{color:#fff}
.text-muted-text{color:#71717a}.text-secondary-text{color:#a1a1aa}.text-disabled-text{color:#52525b}.text-accent-light{color:#f87171}
.text-amber-400{color:#fbbf24}.text-amber-300{color:#fcd34d}.text-emerald-400{color:#34d399}
.text-red-300{color:#fca5a5}.text-red-400{color:#f87171}
.text-slate-300{color:#cbd5e1}.text-slate-500{color:#64748b}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.max-w-\[120px\]{max-width:120px}
.w-3.5{width:14px}.h-2.5{height:10px}.w-20{width:80px}.h-20{height:80px}.w-10{width:40px}.h-10{height:40px}.w-8{width:32px}.h-8{height:32px}
.shrink-0{flex-shrink:0}.min-w-0{min-width:0}.overflow-hidden{overflow:hidden}.overflow-x-auto{overflow-x:auto}
.flex-1{flex:1}.w-full{width:100%}
.italic{font-style:italic}

/* ── Season position ────────────────────────────────────────────────────── */
.dp-pos { display: flex; align-items: baseline; gap: 12px; }
.dp-pos__rank { font-size: 28px; font-weight: 900; color: var(--text-primary); font-family: 'Formula1', sans-serif; }
.dp-pos__pts { font-size: 13px; color: var(--text-secondary); font-weight: 600; }

/* ── Team row — hover reveals colored left border (Save Viewer team-glow-row) ── */
.team-glow-row { transition: border-color 200ms, box-shadow 200ms; border-left: 3px solid transparent; }
.team-glow-row:hover { border-left-color: rgb(var(--team-rgb, var(--accent-rgb))) !important; box-shadow: inset 2px 0 8px rgb(var(--team-rgb, var(--accent-rgb)) / 0.12); }

/* ── Driver photo fallback (matches drivers.html) ───────────────────────── */
.dp-hero__img { width: 100%; height: 100%; object-fit: cover; }

/* ── Empty / misc ───────────────────────────────────────────────────────── */
.dp-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
.tfg-attrib { position: fixed; bottom: 12px; right: 16px; font-size: 9px; color: var(--text-disabled); z-index: 60; font-family: var(--font-mono); }
.tfg-attrib a { color: var(--text-disabled); text-decoration: underline; }
.tfg-attrib a:hover { color: var(--text-muted); }

/* ═══ F1-style Teams ═══════════════════════════════════════════════════════ */
#detail-panel.tm-gridwrap, #detail-panel.tm-view { padding: 0 0 20px; text-align: left; }
.tm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; }
.tm-card {
  position: relative; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr;
  gap: 10px 16px; min-height: 200px; padding: 18px 20px; border: 0; border-radius: 8px; overflow: hidden;
  cursor: pointer; text-align: left; font: inherit; isolation: isolate;
  transition: transform .18s ease, box-shadow .18s ease;
}
.tm-card::before, .tm-banner::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background-image: radial-gradient(rgba(0,0,0,.25) 1.2px, transparent 1.6px); background-size: 6px 6px;
  -webkit-mask-image: linear-gradient(90deg, transparent 25%, #000 80%); mask-image: linear-gradient(90deg, transparent 25%, #000 80%);
}
.tm-card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.35)); }
.tm-card:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(0,0,0,.45); }
.tm-card:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.tm-card__head { grid-column: 1 / 2; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tm-card__name { font: 700 22px/1.15 'Formula1', sans-serif; }
.tm-card__pos { display: flex; align-items: baseline; gap: 8px; font-family: 'Formula1', sans-serif; }
.tm-card__pos b { font-size: 15px; }
.tm-card__pos i { font-style: normal; font-size: 13px; opacity: .85; text-transform: uppercase; }
.tm-card__logo { grid-column: 2; grid-row: 1 / 3; align-self: center; display: flex; align-items: center; justify-content: center; width: 110px; height: 110px; }
.tm-card__logo img { width: 96px !important; height: 96px !important; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
.tm-card__drivers { grid-column: 1 / 2; align-self: end; display: flex; flex-direction: column; gap: 8px; }
.tm-card__driver { display: flex; align-items: center; gap: 10px; font: 400 15px 'Formula1', sans-serif; }
.tm-card__driver b { font-weight: 700; }
.tm-card__face { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: rgba(0,0,0,.25); flex: none; }
.tm-card__face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

/* Team page banner */
.tm-banner {
  position: relative; isolation: isolate; display: flex; justify-content: space-between; align-items: stretch;
  min-height: 320px; border-radius: 8px; overflow: hidden; margin-bottom: 8px;
}
.tm-banner::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0) 60%); }
.tm-banner__text { display: flex; flex-direction: column; justify-content: flex-end; padding: 22px 28px 26px; min-width: 0; }
.tm-back {
  align-self: flex-start; margin-bottom: auto; border: 1px solid currentColor; border-radius: 1000px; background: rgba(0,0,0,.18);
  color: inherit; font: 700 13px 'Titillium Web', sans-serif; padding: 6px 14px; cursor: pointer;
}
.tm-back:hover { background: rgba(0,0,0,.35); }
.tm-banner__kicker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; font: 700 13px 'Titillium Web', sans-serif; text-transform: uppercase; letter-spacing: .04em; }
.tm-banner__titles { background: rgba(0,0,0,.3); border-radius: 1000px; padding: 3px 10px; color: #fff; }
.tm-banner__name { display: flex; align-items: center; gap: 16px; margin-top: 8px; font: 900 clamp(24px, 3.4vw, 44px)/1.05 'Formula1 Wide', 'Formula1', sans-serif; text-transform: uppercase; }
.tm-banner__logo img { width: 56px !important; height: 56px !important; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
.tm-banner__stats { display: flex; flex-wrap: wrap; gap: 10px 30px; margin-top: 20px; }
.tm-banner__stats .tm-stat { background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
.tm-banner__stats .tm-stat__v { color: inherit; font-size: 26px; }
.tm-banner__stats .tm-stat__l { color: inherit; opacity: .8; }
.tm-banner__drivers { display: flex; align-items: flex-end; justify-content: flex-end; padding-right: 16px; flex: none; }
.tm-banner__driver { display: block; height: 300px; margin-left: -40px; }
.tm-banner__driver img { width: auto !important; height: 300px !important; object-fit: contain; object-position: bottom; border-radius: 0 !important; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); transition: transform .2s; }
.tm-banner__driver:hover img { transform: translateY(-4px); }

/* Sections */
.tm-section { margin-top: 34px; }
.tm-section__title { font: 900 clamp(16px, 1.6vw, 22px) 'Formula1 Wide', 'Formula1', sans-serif; text-transform: uppercase; color: #fff; margin: 0 0 16px; }
.tm-dgrid { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); max-width: 1100px; }
.tm-dgrid .f1-dcard { text-decoration: none; }
.tm-expiring { background: rgba(0,0,0,.35); border-radius: 4px; padding: 1px 6px; }
.tm-stats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.tm-stat { background: #1f1f27; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; padding: 14px 10px; text-align: center; }
.tm-stat__v { font: 700 22px 'Formula1', sans-serif; color: #fff; }
.tm-stat__l { margin-top: 4px; font: 700 11px 'Titillium Web', sans-serif; text-transform: uppercase; letter-spacing: .04em; color: #8e8e98; }
.tm-panel { background: #1f1f27; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; min-width: 0; }
.tm-panel__title { font: 700 14px 'Formula1', sans-serif; text-transform: uppercase; color: #fff; margin: 0 0 12px; letter-spacing: 0; }
.tm-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.tm-cols > .tm-panel { margin-bottom: 0; }
.tm-tablewrap { overflow-x: auto; padding: 4px 0; }
.tm-table { width: 100%; border-collapse: collapse; font: 600 14px 'Titillium Web', sans-serif; color: #fff; }
.tm-table th { text-align: left; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: #8e8e98; border-bottom: 1px solid rgba(255,255,255,.15); }
.tm-table td { padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
.tm-table tr:last-child td { border-bottom: 0; }
.tm-table .r { text-align: right; }
.tm-panel .tm-table th, .tm-panel .tm-table td { padding-left: 4px; padding-right: 4px; }
.tm-tablewrap .tm-table th, .tm-tablewrap .tm-table td { padding-left: 16px; padding-right: 16px; }
.tm-rd { font-family: 'Formula1', sans-serif; color: #8e8e98; width: 40px; }
.tm-gp { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; }
.tm-gp:hover { color: #ff2a1f; }
.tm-flag { width: 22px; height: 15px; object-fit: cover; border-radius: 2px; }
.tm-fin { display: inline-block; margin-right: 6px; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,.07); font: 700 12px 'Formula1', sans-serif; }
.tm-fin--win { background: #e10600; }
.tm-fin--pod { background: rgba(255,255,255,.18); }
.tm-strong { font-family: 'Formula1', sans-serif; font-weight: 700; }

</head>
<body data-page="teams">

<nav class="btg-nav" id="btg-nav"></nav>

<div style="max-width:1400px;margin:0 auto;padding:0 16px;">

  <!-- Controls: series tabs + season selector -->
  <div class="dp-controls">
    <div class="series-bar" id="series-bar" style="border:none;background:none;padding:0;"></div>
    <span class="dp-spacer"></span>
    <span class="label">Season</span>
    <select id="season-select"></select>
  </div>

  <!-- Team grid (landing) or one team's page -->
  <div id="detail-panel" class="dp-empty">Loading teams…</div>
</div>

<div class="tfg-attrib">UI by <a href="https://www.patreon.com/c/TFGTools" target="_blank" rel="noopener">TFGTools</a></div>

<script src="js/common.js?v=f1-theme-3"></script>
<script src="js/driver-numbers.js?v=20261117-yearly-style-6"></script>
<script src="js/border-glow.js"></script>
<script src="teams/f1.js?v=20261117-lineups-photos"></script>
<script src="js/roster.js"></script>
<script src="js/db-cache.js?v=20261117-profile-team-16"></script>
<script src="js/circuits.js"></script>
<script>
(function() {
  'use strict';

  var activeSeries = 'F1', activeSeason = null, selectedTeamId = null;
  var seriesList = [], seasons = [], teamList = [];
  var D = null;
  var raceToSeason = {};
  var rgb = 'var(--accent-rgb)';

  /* Full-logo hero fallback: walk logos/full/{year} candidates; on total
     failure collapse the whole hero card (no empty placeholder box). */
  window.BTG = window.BTG || {};
  BTG.fullLogoStep = function (el) {
    if (!el) return;
    var list = (el.getAttribute('data-logos') || '').split('|').filter(Boolean);
    var idx = Number(el.getAttribute('data-logo-idx') || 0) + 1;
    if (idx < list.length) {
      el.setAttribute('data-logo-idx', idx);
      el.src = list[idx];
    } else {
      // Hide image AND collapse the card so no placeholder shows.
      el.style.display = 'none';
      var card = el.closest('.dp-card');
      var glow = el.closest('.border-glow-card');
      if (card) card.style.display = 'none';
      else if (glow) glow.style.display = 'none';
    }
  };

  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function str(v) { return v == null ? '' : String(v); }
  function esc(v) { return (window.BTG && BTG.esc) ? BTG.esc(str(v)) : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ── DB team helpers ─────────────────────────────────────────────────── */
  function dbTeam(id) {
    return (D && D.teams || []).filter(function (t) { return String(t.team_id) === String(id); })[0] || null;
  }
  function teamKey(id) { var t = dbTeam(id); return t ? str(t.team_key) : String(id); }
  function teamName(id) {
    var t = dbTeam(id);
    if (t && t.team_name) return str(t.team_name);
    var k = teamKey(id);
    try { var n = BTG.Roster.teamName(k, true); if (n) return n; } catch (e) {}
    return k;
  }
  /* Official full name for a team in a given season — straight from the DB.
     Prefers the "Team Identity" table (per-season Short/Full Name), then
     team_season_names, then the base team_name. Never hardcoded. */
  function teamFullName(id, year) {
    if (window.BTG && BTG.DBCache && BTG.DBCache.teamFullName) {
      var n = BTG.DBCache.teamFullName(id, year);
      if (n && n !== String(id)) return n;
    }
    var rows = (D && D.team_season_names || []).filter(function (n) {
      return String(n.team_id) === String(id) && num(n.season) === num(year);
    });
    if (rows.length && rows[0].full_name) return str(rows[0].full_name);
    return teamName(id);
  }
  /* The team's second colour, which the band runs to; falls back to the primary when the save has none. */
  function teamRgbSecondary(id) {
    var t = dbTeam(id);
    var hex = t && t.color_secondary ? str(t.color_secondary) : '';
    var m = hex.replace('#', '');
    if (m.length === 3) m = m[0] + m[0] + m[1] + m[1] + m[2] + m[2];
    var n = parseInt(m, 16);
    if (isNaN(n)) return teamRgb(id);
    return ((n >> 16) & 255) + ' ' + ((n >> 8) & 255) + ' ' + (n & 255);
  }

  function teamRgb(id) {
    var t = dbTeam(id);
    var hex = t && t.color_primary ? str(t.color_primary) : '';
    var m = hex.replace('#', '');
    if (m.length === 3) m = m[0]+m[0]+m[1]+m[1]+m[2]+m[2];
    var n = parseInt(m, 16);
    if (isNaN(n)) return null;
    return ((n>>16)&255) + ' ' + ((n>>8)&255) + ' ' + (n&255);
  }
  function seasonIdFor(series, year) {
    var rows = (D && D.race_seasons || []).filter(function (s) {
      return String(s.series_id) === series && num(s.year) === num(year);
    });
    return rows.length ? num(rows[0].season_id) : null;
  }
  function seasonYear(seasonId) {
    var rows = (D && D.race_seasons || []).filter(function (s) { return String(s.season_id) === String(seasonId); });
    return rows.length ? num(rows[0].year) : num(seasonId);
  }
  function raceSeasonId(raceId) { return raceToSeason[String(raceId)] || null; }

  /* Series team-title label straight from the DB (series.team_championship) —
     never hardcoded, so adding a new series is just a DB row. */
  function seriesChampionshipLabel(seriesId) {
    var rows = (D && D.series || []).filter(function (s) { return String(s.series_id) === String(seriesId); });
    return (rows.length && rows[0].team_championship) ? str(rows[0].team_championship) : 'Championship';
  }

  /* Whether a series shows a staff roster — straight from the DB
     (series.has_staff). F1 = true, F2 / F3 / GT / XGT = false. */
  function seriesHasStaff(seriesId) {
    var rows = (D && D.series || []).filter(function (s) { return String(s.series_id) === String(seriesId); });
    return !!(rows.length && rows[0].has_staff);
  }

  /* True when every scheduled race in a season has at least one result row —
     i.e. the season is over. Being P1 mid-season is a position, not a title. */
  function seasonComplete(seasonId) {
    var scheduled = (D && D.races || []).filter(function (r) { return String(r.season_id) === String(seasonId); });
    if (!scheduled.length) return false;
    var done = {};
    (D && D.race_results || []).forEach(function (r) {
      if (String(raceSeasonId(r.race_id)) === String(seasonId)) done[String(r.race_id)] = true;
    });
    return scheduled.every(function (r) { return done[String(r.race_id)]; });
  }

  /* ── Full logo: logos/full/{year}/{DB team name} — year-aware fallback ─
     For the selected season year Y we look in logos/full/Y/ first; if the
     team has no file there we fall back to earlier years (Y-1 … 2024). The
     filename uses the same DB team name as the team (variants for common
     spellings). If NO full-format file exists in ANY year the hero collapses
     entirely (BTG.fullLogoStep) — no fallback to the regular team logo, no
     placeholder; when the full logo isn't there it's just empty.
     `altNames` (optional) lets the caller also try the short DB name when
     the display name is the per-season full name (e.g. "Scuderia Ferrari"
     falls back to "Ferrari").                                            */
  function fullLogoCandidates(teamName, year, altNames) {
    if (!teamName) return [];
    var variants = (window.BTG && BTG.logoNameVariants) ? BTG.logoNameVariants(teamName) : [teamName];
    (altNames || []).forEach(function (alt) {
      if (!alt || String(alt) === String(teamName)) return;
      (window.BTG && BTG.logoNameVariants ? BTG.logoNameVariants(alt) : [alt]).forEach(function (v) {
        if (variants.indexOf(v) === -1) variants.push(v);
      });
    });
    var minYear = 2024;
    var out = [];
    var y = Math.max(num(year) || 2024, minYear);
    for (; y >= minYear; y--) {
      variants.forEach(function (v) {
        out.push('logos/full/' + y + '/' + v + '.png');
        out.push('logos/full/' + y + '/' + v + '.webp');
      });
    }
    // Only offer files the manifest says exist. The full-logo folder is mostly
    // empty, so building every candidate produced ~28 404s per teams-page load
    // before the onerror chain collapsed the hero. When the manifest has not
    // loaded yet we keep the old behaviour (the fallback chain still works).
    var known = BTG.LOGO_FILES;
    if (!known || !known.size) return out;
    var hits = out.filter(function (p) { return known.has(p); });
    return hits;
  }
  function fullLogoImg(teamName, year, altNames) {
    var cands = fullLogoCandidates(teamName, year, altNames);
    if (!cands.length) return '';
    var chain = cands.map(function (p) { return p.replace(/"/g, '&quot;'); }).join('|');
    return '<img src="' + cands[0] + '" alt="' + esc(teamName) + '" '
      + 'data-logos="' + chain + '" data-logo-idx="0" onerror="BTG.logoStep(this)">';
  }

  /* Full-team-logo hero: BorderGlow card + the year-aware full logo. When no
     file exists in ANY year the whole card collapses (BTG.fullLogoStep) so no
     empty placeholder box is ever shown. `altNames` = short DB name fallbacks
     so full names ("Scuderia Ferrari") still resolve "Ferrari"-keyed files. */
  function fullLogoHero(teamName, year, altNames) {
    var cands = fullLogoCandidates(teamName, year, altNames);
    if (!cands.length) return '';
    var chain = cands.map(function (p) { return p.replace(/"/g, '&quot;'); }).join('|');
    return glow(
      '<div class="dp-card" style="display:flex;align-items:center;justify-content:center;min-height:200px;padding:24px;">'
      + '<div style="width:100%;height:100%;max-height:200px;">'
      + '<img src="' + cands[0] + '" alt="' + esc(teamName) + '" '
      + 'data-logos="' + chain + '" data-logo-idx="0" '
      + 'onerror="BTG.fullLogoStep(this)" style="width:100%;height:100%;max-height:200px;object-fit:contain;">'
      + '</div></div>'
    );
  }

  /* ── Boot ────────────────────────────────────────────────────────────── */
  // The logo manifest now loads in common.js; wait for it so the full-logo
  // hero only requests files that exist.
  (BTG.loadLogoManifest ? BTG.loadLogoManifest() : Promise.resolve())
    .then(function () { return BTG.DBCache.init(); })
    .then(function (dbData) {
      if (!dbData) { document.getElementById('detail-panel').innerHTML = 'No team data available'; return; }
      D = dbData;
      (D.races || []).forEach(function (r) { raceToSeason[String(r.race_id)] = String(r.season_id); });
      readUrl();
      buildSeries();
      load();
    });

  function buildSeries() {
    var order = {};
    (D.series || []).forEach(function (s) { order[s.series_id] = num(s.sort_order); });
    var withTeams = {};
    (D.teams || []).forEach(function (t) { if (t.series) withTeams[t.series] = true; });
    seriesList = (D.series || [])
      .filter(function (s) { return withTeams[s.series_id]; })
      .sort(function (a, b) {
        var oa = order[a.series_id] != null ? order[a.series_id] : 99;
        var ob = order[b.series_id] != null ? order[b.series_id] : 99;
        return (oa - ob) || (a.series_id < b.series_id ? -1 : a.series_id > b.series_id ? 1 : 0);
      })
      .map(function (s) { return { id: s.series_id, name: s.name || s.series_id }; });
    if (!seriesList.length) seriesList = [{ id: 'F1', name: 'Formula 1' }];
    if (seriesList.filter(function (s) { return s.id === activeSeries; }).length === 0) activeSeries = seriesList[0].id;
  }

  function load() {
    seasons = (window.BTG && BTG.DBCache && BTG.DBCache.getSeasons) ? BTG.DBCache.getSeasons(activeSeries) : [];
    if (!seasons.length) seasons = [2024];
    if (seasons.indexOf(activeSeason) === -1) activeSeason = seasons[0];
    buildTeamList();
    renderControls();
    if (selectedTeamId != null && !teamList.some(function (t) { return String(t.team_id) === String(selectedTeamId); })) selectedTeamId = null;
    syncUrl(true);
    if (selectedTeamId != null) renderDetail(); else renderGrid();
  }

  /* ── URL: ?series=F1&season=2024&team=3 so a team page can be linked and Back works ── */
  function syncUrl(replace) {
    var q = new URLSearchParams();
    q.set('series', activeSeries);
    if (activeSeason) q.set('season', activeSeason);
    if (selectedTeamId != null) q.set('team', selectedTeamId);
    var url = location.pathname + '?' + q.toString();
    if (url === location.pathname + location.search) return;
    if (replace) history.replaceState(null, '', url); else history.pushState(null, '', url);
  }
  function readUrl() {
    var q = new URLSearchParams(location.search);
    if (q.get('series')) activeSeries = q.get('series');
    if (Number(q.get('season'))) activeSeason = Number(q.get('season'));
    selectedTeamId = q.get('team') || null;
  }
  window.addEventListener('popstate', function () {
    if (!D) return;
    readUrl();
    buildSeries();
    load();
  });

  function buildTeamList() {
    var sid = seasonIdFor(activeSeries, activeSeason);
    var posByTeam = {};
    (D.season_team_standings || []).forEach(function (r) {
      if (sid != null && String(r.season_id) !== String(sid)) return;
      if (posByTeam[String(r.team_id)] == null) posByTeam[String(r.team_id)] = num(r.position);
    });
    var teams = (D.teams || []).filter(function (t) { return String(t.series) === activeSeries; });
    teamList = teams.slice().sort(function (a, b) {
      var oa = posByTeam[String(a.team_id)] != null ? posByTeam[String(a.team_id)] : 99;
      var ob = posByTeam[String(b.team_id)] != null ? posByTeam[String(b.team_id)] : 99;
      if (oa !== ob) return oa - ob;
      return (a.team_key < b.team_key ? -1 : a.team_key > b.team_key ? 1 : 0);
    }).map(function (t) {
      return {
        team_id: t.team_id,
        key: t.team_key,
        name: teamFullName(t.team_id, activeSeason),
        pos: posByTeam[String(t.team_id)] != null ? posByTeam[String(t.team_id)] : null
      };
    });
  }

  /* ── Controls (series tabs + season) ─────────────────────────────────── */
  function renderControls() {
    var bar = document.getElementById('series-bar');
    bar.innerHTML = '';
    seriesList.forEach(function (s) {
      var t = document.createElement('div');
      t.className = 'series-tab' + (s.id === activeSeries ? ' active' : '');
      t.style.setProperty('--series-color', (window.BTG && BTG.seriesAccent) ? BTG.seriesAccent(s.id) : '#dc2626');
      t.setAttribute('data-series', s.id);
      t.innerHTML = (window.BTG && BTG.seriesLogoImg) ? BTG.seriesLogoImg(s.id, 26) : esc(s.name);
      t.title = s.name;
      t.onclick = function () {
        activeSeries = s.id;
        selectedTeamId = null;
        load();
        bar.querySelectorAll('.series-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-series') === s.id); });
      };
      bar.appendChild(t);
    });

    var sel = document.getElementById('season-select');
    sel.innerHTML = '';
    seasons.forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
    sel.value = activeSeason;
    sel.onchange = function () {
      activeSeason = Number(this.value);
      selectedTeamId = null;
      load();
    };
  }

  /* ── Team grid (F1 teams page) ────────────────────────────────────── */
  function teamBandFor(tid) {
    var band = BTG.teamBand ? BTG.teamBand(teamRgb(tid) || '110 110 118', teamRgbSecondary(tid)) : null;
    return band || { from: '#303037', to: '#4a4a52', ink: '#fff', style: 'background:linear-gradient(90deg,#303037,#4a4a52);color:#fff' };
  }
  function teamPoints(tid) {
    var sid = seasonIdFor(activeSeries, activeSeason);
    var row = (D.season_team_standings || []).filter(function (r) {
      return String(r.team_id) === String(tid) && (sid == null || String(r.season_id) === String(sid));
    })[0];
    return row ? num(row.points) : null;
  }
  function renderGrid() {
    var panel = document.getElementById('detail-panel');
    panel.className = 'tm-gridwrap';
    if (!teamList.length) { panel.innerHTML = '<div class="dp-empty">No teams for this season.</div>'; return; }
    var html = '<div class="tm-grid">';
    teamList.forEach(function (t) {
      var band = teamBandFor(t.team_id);
      var pts = teamPoints(t.team_id);
      var lineup = resolveDrivers(t.team_id).slice(0, 2);
      html += '<button type="button" class="tm-card" data-tid="' + esc(t.team_id) + '" style="' + band.style + '">'
        + '<span class="tm-card__head">'
        +   '<span class="tm-card__name">' + esc(t.name) + '</span>'
        +   (t.pos != null ? '<span class="tm-card__pos"><b>P' + t.pos + '</b>' + (pts != null ? '<i>' + pts + ' pts</i>' : '') + '</span>' : '')
        + '</span>'
        + '<span class="tm-card__logo">' + (BTG.teamLogoImg ? BTG.teamLogoImg(t.key, activeSeries, 72) : '') + '</span>'
        + '<span class="tm-card__drivers">' + lineup.map(function (d) {
            var nm = driverName(d);
            return '<span class="tm-card__driver"><span class="tm-card__face">' + BTG.driverPhotoImg(nm, 40, '', activeSeason) + '</span>'
              + '<span>' + esc(d.first_name) + ' <b>' + esc(d.last_name) + '</b></span></span>';
          }).join('') + '</span>'
        + '</button>';
    });
    html += '</div>';
    panel.innerHTML = html;
    panel.querySelectorAll('.tm-card').forEach(function (btn) {
      btn.onclick = function () { selectTeam(btn.getAttribute('data-tid')); };
    });
  }

  function selectTeam(tid) {
    selectedTeamId = tid;
    syncUrl(false);
    renderDetail();
    window.scrollTo(0, 0);
  }
  function backToGrid() {
    selectedTeamId = null;
    syncUrl(false);
    renderGrid();
    window.scrollTo(0, 0);
  }

  /* ── Detail ──────────────────────────────────────────────────────────── */
  function staffForTeam(tid, sid) {
    var rows = (D.team_staff || []).filter(function (s) { return String(s.team_id) === String(tid); });
    if (sid != null) {
      var bySeason = rows.filter(function (s) { return String(s.season_id) === String(sid); });
      if (bySeason.length) rows = bySeason;
    }
    return rows;
  }

  function driverName(r) { return str(r.first_name) + ' ' + str(r.last_name); }

  function driverNumber(name) {
    var rows = (D.drivers || []).filter(function (dd) { return str(dd.full_name) === name; });
    if (rows.length && rows[0].driver_number != null) return num(rows[0].driver_number);
    try { var rd = BTG.Roster.driverByName(name); if (rd && rd.number != null) return rd.number; } catch (e) {}
    return null;
  }

  /*
   * The deals that are live in the season on screen: a deal is only current for the years it actually runs,
   * so a contract signed from 2025 does not appear while 2024 is being read. A row with no `from_year` has
   * always been in place, and one that simply ends in `till_year` covers every season up to it.
   */
  function currentContracts(tid) {
    var year = num(activeSeason);
    return (D.contract_history || []).filter(function (h) {
      if (String(h.team_id) !== String(tid) || !h.is_current) return false;
      var from = h.from_year == null ? null : num(h.from_year);
      var till = h.till_year == null ? null : num(h.till_year);
      if (from != null && year && from > year) return false;
      if (till != null && year && till < year) return false;
      return true;
    });
  }

  /* The team's drivers for the season on screen (current Driving contracts +
     everyone who raced for the team this season), in car order. */
  function resolveDrivers(tid) {
    var sid = seasonIdFor(activeSeries, activeSeason);
    var contracts = currentContracts(tid);
    var seasonResults = (D.race_results || []).filter(function (r) {
      return String(r.team_id) === String(tid) && sid != null && String(raceSeasonId(r.race_id)) === String(sid);
    });
    var staff = staffForTeam(tid, sid);
    // ── Drivers (authoritative identity) ──────────────────────────────────
    // The ONLY source of who is a FULL driver at this team is the CURRENT
    // Driving contract (`contract_history` role=Driving, is_current=true).
    // A reserve/junior is always shown as a reserve/junior — never as a
    // driver — and a driver who left mid-season has no current contract, so
    // they don't show here either. The `drivers` table is a name/number/OVR
    // lookup only (never a membership source). Names are normalized (first +
    // last, middle names dropped) so "Theo Rafael Amaro" == "Theo Amaro".
    var driverPool = {};   // normKey -> { name, number, ovr, endSeason }
    var poolOrder = [];
    function normName(nm) {
      var parts = String(nm).toLowerCase().replace(/\s+/g, ' ').trim().split(' ');
      if (!parts.length || !parts[0]) return '';
      return parts[0] + ' ' + parts[parts.length - 1]; // drop middle names
    }
    function addDriver(nm, number, ovr, endSeason) {
      if (!nm) return;
      var key = normName(nm);
      if (!key) return;
      if (!driverPool[key]) {
        driverPool[key] = { name: str(nm), number: number, ovr: ovr, endSeason: endSeason };
        poolOrder.push(key);
      } else {
        var e = driverPool[key];
        if (number != null) e.number = number;
        if (ovr != null) e.ovr = ovr;
        if (endSeason != null) e.endSeason = endSeason;
        if (str(nm).length > e.name.length) e.name = str(nm); // prefer fuller name variant
      }
    }
    // 1) Current Driving contracts — the authoritative lineup.
    contracts.forEach(function (h) {
      if (str(h.entity_type) !== 'driver' || str(h.role) !== 'Driving') return;
      var d = (D.drivers || []).filter(function (dd) { return normName(dd.full_name) === normName(str(h.entity_name)); })[0];
      addDriver(str(h.entity_name), d ? d.driver_number : null, d ? d.ovr : null, h.till_year);
    });
    // 2) Drivers who actually RACED for this team this season — the ground
    //    truth of the lineup. This covers feeder-series drivers whose contract
    //    (hire) is held by ANOTHER team — e.g. an F2 seat for an F1 junior or
    //    reserve (Fabian Stahl is a Haas junior but drives for F2 ART). Their
    //    current contract lives elsewhere, so the contract-based pool alone
    //    would wrongly hide them from their racing team's page.
    //
    //    Their SEAT here is a per-season deal: we mark it as expiring at the
    //    end of the current season (activeSeason), NOT with the longer junior/
    //    reserve contract they hold at their other team. Otherwise an F2
    //    driver would show "Until 2027" (their junior deal) instead of the
    //    EXPIRING status of their actual F2 seat.
    seasonResults.forEach(function (r) {
      var nm = str(r.driver_name);
      if (!nm) return;
      var d = (D.drivers || []).filter(function (dd) { return normName(dd.full_name) === normName(nm); })[0];
      addDriver(nm, d ? d.driver_number : null, d ? d.ovr : null, activeSeason);
    });

    var drivers = poolOrder.map(function (key) {
      var e = driverPool[key];
      var parts = e.name.split(' ');
      var staffRow = staff.filter(function (s) { return normName(driverName(s)) === key; })[0];
      return {
        pos_in_team: staffRow ? num(staffRow.pos_in_team) : 0,
        first_name: parts[0] || '',
        last_name: parts.slice(1).join(' ') || '',
        overall: e.ovr != null ? num(e.ovr) : (staffRow && staffRow.overall != null ? num(staffRow.overall) : null),
        contract_end_season: e.endSeason != null ? num(e.endSeason) : null,
        number: e.number != null ? num(e.number) : null
      };
    });
    // Car order: seat 1 (car 1) first, then seat 2, then reserve/junior seats.
    // Without this the lineup followed contract-creation order, so the car 2
    // driver was listed first for teams whose second seat was signed earlier.
    // Scoped to THIS team: a driver can hold a second seat at another team /
    // series (e.g. an F1 junior whose F2 seat is car 1), and that seat must
    // not reorder this team's cars.
    if (BTG.DBCache && BTG.DBCache.sortByCar) {
      drivers = BTG.DBCache.sortByCar(drivers, activeSeason, { team: tid, series: activeSeries });
    }
    drivers = drivers.slice(0, 4); // up to 4 drivers per team, per DB rules
    return drivers;
  }

  /* BorderGlow wrapper — matches the Save Viewer's <BorderGlow … isSelected> */
  function glow(inner) {
    return BTG.wrapCard(inner, {
      teamColor: rgb,
      backgroundColor: '#161618',
      borderRadius: 8,
      glowRadius: 12,
      glowIntensity: 0.45,
      selected: true
    });
  }

  /* StaffPhoto equivalent — BTG has no /StaffPhotos, use an initials avatar */
  function staffAvatar(name, size) {
    var s = size || 40;
    return '<div class="flex items-center justify-center overflow-hidden rounded-full bg-black/20"'
      + ' style="width:' + s + 'px;height:' + s + 'px;border:1px solid rgba(255,255,255,0.1);flex:none;">'
      + '<span style="font-size:' + Math.round(s * 0.4) + 'px;font-weight:700;color:#71717a;font-family:var(--font-mono);">' + esc(initials(name)) + '</span></div>';
  }

  /* StatTile equivalent — exact Save Viewer StatTile markup */
  function statTile(value, label, color) {
    var valCls = color || 'text-white';
    return '<div class="text-center bg-white/[0.01] border border-white/[0.04] rounded p-1.5">'
      + '<div class="text-base font-extrabold ' + valCls + '">' + value + '</div>'
      + '<div class="text-[8px] font-semibold uppercase tracking-[0.04em] text-muted-text mt-0.5">' + label + '</div>'
      + '</div>';
  }

  /* EmptyState equivalent (compact) */
  function empty(msg) { return '<div class="text-center text-sm text-muted-text py-4">' + esc(msg) + '</div>'; }

  function card(title, body) {
    return '<div class="dp-card"><div class="dp-card__title">' + title + '</div>' + body + '</div>';
  }

  /* Driver contract status pill (LEAVING / Until / EXPIRING) */
  function driverStatus(endSeason, extra) {
    var e = num(endSeason);
    if (e > 0 && e > activeSeason) return '<div class="mt-1 text-[10px] text-secondary-text">Until ' + e + '</div>';
    if (e > 0 && e <= activeSeason) return '<div class="mt-1 rounded bg-red-500/15 px-2 py-0.5 text-[9px] font-bold text-red-300 inline-block">EXPIRING</div>';
    return '';
  }
  function smallStatus(endSeason) {
    var e = num(endSeason);
    if (e > 0 && e <= activeSeason) return '<span class="rounded bg-red-500/15 px-2 py-0.5 text-[9px] font-bold text-red-300">EXPIRING</span>';
    return '';
  }
  function untilLabel(endSeason) {
    var e = num(endSeason);
    if (e > 0 && e > activeSeason) return '<span class="text-[9px] text-secondary-text">Until ' + e + '</span>';
    return '';
  }

  function renderDetail() {
    var panel = document.getElementById('detail-panel');
    if (selectedTeamId == null) { renderGrid(); return; }

    var tid = selectedTeamId;
    var sid = seasonIdFor(activeSeries, activeSeason);
    var t = dbTeam(tid);
    var name = teamFullName(tid, activeSeason);
    rgb = teamRgb(tid) || 'var(--accent-rgb)';
    // Set the team colour on the panel so every .dp-card / .team-glow-row
    // child picks up the team's border glow (CSS uses rgb(var(--team-rgb)/a),
    // which needs SPACE-separated channels).
    /* The colour is set on the layout, not the panel, so the page reads as the team's: every card under it
       draws its own team border from the same variable. */
    var layout = document.getElementById('dp-layout');
    if (layout) layout.style.setProperty('--team-rgb', rgb);
    panel.style.setProperty('--team-rgb', rgb);
    var teamColor = 'rgb(' + rgb + ')';

    // Results + contracts — needed by the driver resolution below, so compute
    // them first.
    var contracts = currentContracts(tid);
    var seasonResults = (D.race_results || []).filter(function (r) {
      return String(r.team_id) === String(tid) && sid != null && String(raceSeasonId(r.race_id)) === String(sid);
    });
    // Sprints score championship points too, so the season totals shown on this
    // page must include them (the official standings do). They are tagged so the
    // per-race card can fold them into the same round.
    var seasonSprints = (D.race_sprints || []).filter(function (s) {
      return String(s.team_id) === String(tid) && sid != null && String(raceSeasonId(s.race_id)) === String(sid);
    }).map(function (s) { return Object.assign({}, s, { isSprint: true }); });
    var allTimeSprints = (D.race_sprints || []).filter(function (s) { return String(s.team_id) === String(tid); })
      .map(function (s) { return Object.assign({}, s, { isSprint: true }); });
    var allTimeResults = (D.race_results || []).filter(function (r) { return String(r.team_id) === String(tid); });

    var staff = staffForTeam(tid, sid);
    var nonDriver = staff.filter(function (s) { return str(s.role_label) !== 'Driver'; });

    var drivers = resolveDrivers(tid);

    var raceEng = {};
    staff.filter(function (s) { return str(s.role_label) === 'Race Engineer'; }).forEach(function (s) {
      raceEng[num(s.pos_in_team)] = s;
    });

    // Reserves / juniors from current contract history
    var currentDriverNames = {};
    drivers.forEach(function (d) { currentDriverNames[driverName(d)] = true; });
    var reserves = [], juniors = [];
    contracts.forEach(function (h) {
      if (str(h.entity_type) !== 'driver') return;
      var nm = str(h.entity_name);
      if (currentDriverNames[nm]) return;
      var r = str(h.role);
      if (r === 'Reserve') reserves.push(h);
      else if (r === 'Junior' || r === 'Affiliate') juniors.push(h);
    });

    // Standings history + WCC + team history. A title only counts once the
    // season is COMPLETE (every race run) — leading mid-season is just a
    // position, not a championship.
    var standingsHist = (D.season_team_standings || [])
      .filter(function (r) { return String(r.team_id) === String(tid); })
      .slice().sort(function (a, b) { return num(a.season_id) - num(b.season_id); });
    var wccTitles = standingsHist.filter(function (r) {
      return num(r.position) === 1 && seasonComplete(r.season_id);
    });
    var teamSeasons = {};
    standingsHist.forEach(function (r) { teamSeasons[seasonYear(r.season_id)] = true; });
    (D.team_engine_history || []).filter(function (e) { return String(e.team_id) === String(tid); })
      .forEach(function (e) { teamSeasons[seasonYear(e.season_id)] = true; });
    allTimeResults.forEach(function (r) {
      var sid2 = raceSeasonId(r.race_id);
      if (sid2) teamSeasons[seasonYear(sid2)] = true;
    });

    // Engine history
    var engineHist = (D.team_engine_history || [])
      .filter(function (e) { return String(e.team_id) === String(tid); })
      .slice().sort(function (a, b) { return num(a.season_id) - num(b.season_id); })
      .map(function (e) { return { season: seasonYear(e.season_id), engine: str(e.engine_name) }; });

    // Past drivers (all-time race results, excluding current)
    var pastDrivers = [];
    var pastSeen = {};
    allTimeResults.forEach(function (r) {
      var nm = str(r.driver_name);
      if (!nm || currentDriverNames[nm] || pastSeen[nm]) return;
      pastSeen[nm] = true;
      pastDrivers.push(nm);
    });
    // Plus non-current driving contracts for this team
    contracts.forEach(function (h) {
      if (str(h.entity_type) !== 'driver' || str(h.role) !== 'Driving') return;
      var nm = str(h.entity_name);
      if (!nm || currentDriverNames[nm] || pastSeen[nm]) return;
      pastSeen[nm] = true;
      pastDrivers.push(nm);
    });

    // Stats
    var cur = seasonStats(seasonResults.concat(seasonSprints));
    var all = seasonStats(allTimeResults.concat(allTimeSprints));

    // Latest standings position
    var curStanding = standingsHist.length ? standingsHist[standingsHist.length - 1] : null;

    // ── Team History timeline (port of TeamTimeline) ──
    var years = Object.keys(teamSeasons).map(Number).sort(function (a, b) { return a - b; });
    if (!years.length) years = [activeSeason];
    var timeline = years.map(function (y) {
      var eh = engineHist.filter(function (e) { return e.season === y; })[0];
      return { season: y, label: teamFullName(tid, y), color: teamColor, engineName: eh ? eh.engine : null };
    });
    var brandBlocks = [];
    timeline.forEach(function (e) {
      var last = brandBlocks[brandBlocks.length - 1];
      if (last && last.label === e.label && last.endYear === e.season - 1) last.endYear = e.season;
      else brandBlocks.push({ label: e.label, startYear: e.season, endYear: e.season });
    });
    var engineStints = [];
    timeline.forEach(function (e) {
      if (!e.engineName) return;
      var last = engineStints[engineStints.length - 1];
      if (last && last.name === e.engineName && last.endYear === e.season - 1) last.endYear = e.season;
      else engineStints.push({ name: e.engineName, startYear: e.season, endYear: e.season });
    });
    var engineLogoPath = function (en) {
      return 'logos/brands/' + String(en).replace(/\s+/g, '-') + '.png';
    };
    var tlHtml =
      '<div style="display:flex;align-items:center;gap:0;margin-bottom:4px;">'
      + years.map(function (y) { return '<div style="flex:1;text-align:center;font-size:9px;color:#52525b;font-weight:600;">' + y + '</div>'; }).join('')
      + '</div>'
      /* Year blocks */
      + '<div style="display:flex;align-items:stretch;gap:0;">'
      + years.map(function (y, yi) {
          var entry = timeline[yi];
          var prev = yi > 0 ? timeline[yi - 1] : null;
          var isBrandChange = prev && entry.label !== prev.label;
          var showBorder = yi > 0 && prev && !isBrandChange && entry.label === prev.label;
          var block = brandBlocks.filter(function (b) { return b.label === entry.label && y >= b.startYear && y <= b.endYear; })[0];
          var midYear = block ? Math.round((block.startYear + block.endYear) / 2) : y;
          var showLogo = y === midYear;
          return '<div style="flex:1;height:30px;position:relative;background:' + entry.color + ';'
            + 'border-left:' + (showBorder ? '1px solid rgba(0,0,0,0.25)' : 'none') + ';'
            + 'display:flex;align-items:center;justify-content:center;gap:3px;'
            + 'opacity:' + (Number(y) === Number(activeSeason) ? 1 : 0.7) + ';">'
            + (showLogo ? (BTG.teamLogoImg ? BTG.teamLogoImg(teamKey(tid), activeSeries, 14) : esc(name)) : '')
            + (isBrandChange ? '<div style="position:absolute;left:-6px;top:-8px;font-size:8px;color:#fbbf24;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,0.8);z-index:2;">◆</div>' : '')
            + '</div>';
        }).join('')
      + '</div>'
      /* Engine row */
      + (engineStints.length
          ? '<div style="display:flex;align-items:stretch;gap:0;margin-top:4px;min-height:26px;">'
            + years.map(function (y) {
                var stint = engineStints.filter(function (s) { return y >= s.startYear && y <= s.endYear; })[0];
                if (!stint) return '<div style="flex:1;height:26px;"></div>';
                var midYear = Math.round((stint.startYear + stint.endYear) / 2);
                var showLogo = y === midYear;
                return '<div style="flex:1;height:26px;background:#333;display:flex;align-items:center;justify-content:center;opacity:0.85;">'
                  + (showLogo ? '<img src="' + engineLogoPath(stint.name) + '" alt="' + esc(stint.name) + '"'
                      + ' style="height:16px;width:auto;max-width:90%;object-fit:contain;" onerror="this.style.display=\'none\';">' : '')
                  + '</div>';
              }).join('')
            + '</div>'
          : '')
      /* Label row */
      + '<div style="display:flex;align-items:center;gap:0;margin-top:6px;">'
      + brandBlocks.map(function (b) {
          var span = b.endYear - b.startYear + 1;
          return '<div style="flex:' + span + ';display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;color:#a1a1aa;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0;">'
            + '<span>' + esc(b.label) + '</span></div>';
        }).join('')
      + '</div>';

    var band = teamBandFor(tid);
    var seasonStanding = standingsHist.filter(function (r) { return String(r.season_id) === String(sid); })[0] || null;
    function nationOf(nm) {
      var row = (D.drivers || []).filter(function (dd) { return str(dd.full_name) === nm; })[0];
      return row ? row.nation : '';
    }
    function tmStat(value, label) {
      return '<div class="tm-stat"><div class="tm-stat__v">' + value + '</div><div class="tm-stat__l">' + label + '</div></div>';
    }
    function section(title, body) {
      return '<section class="tm-section"><h2 class="tm-section__title">' + title + '</h2>' + body + '</section>';
    }
    function driverHref(nm) {
      return 'drivers.html?driver=' + encodeURIComponent(nm) + '&series=' + encodeURIComponent(activeSeries) + '&season=' + encodeURIComponent(activeSeason);
    }

    /* ===== Banner: team colours, name, key numbers, race drivers standing in it ===== */
    var bannerDrivers = drivers.slice(0, 2);
    var banner = '<section class="tm-banner" style="' + band.style + '">'
      + '<div class="tm-banner__text">'
      +   '<button type="button" class="tm-back" id="tm-back">&larr; All teams</button>'
      +   '<div class="tm-banner__kicker">' + esc(activeSeries) + ' ' + esc(activeSeason)
      +     (wccTitles.length ? '<span class="tm-banner__titles">&#127942; ' + wccTitles.length + '&times; ' + esc(seriesChampionshipLabel(activeSeries)) + '</span>' : '')
      +   '</div>'
      +   '<div class="tm-banner__name">' + (BTG.teamLogoImg ? '<span class="tm-banner__logo">' + BTG.teamLogoImg(teamKey(tid), activeSeries, 56) + '</span>' : '') + '<span>' + esc(name) + '</span></div>'
      +   '<div class="tm-banner__stats">'
      +     tmStat(seasonStanding ? 'P' + seasonStanding.position : '—', 'Position')
      +     tmStat(seasonStanding ? seasonStanding.points : cur.points, 'Points')
      +     tmStat(cur.wins, 'Wins')
      +     tmStat(cur.podiums, 'Podiums')
      +   '</div>'
      + '</div>'
      + '<div class="tm-banner__drivers">' + bannerDrivers.map(function (d) {
          return '<a class="tm-banner__driver" href="' + driverHref(driverName(d)) + '" title="' + esc(driverName(d)) + '">' + BTG.driverPhotoImg(driverName(d), 260, '', activeSeason) + '</a>';
        }).join('') + '</div>'
      + '</section>';

    /* ===== 1. Drivers — F1 driver cards ===== */
    var driversHtml = drivers.length ? '<div class="f1-dgrid tm-dgrid">' + drivers.map(function (d, idx) {
        var nm = driverName(d);
        var num2 = d.number != null ? num(d.number) : driverNumber(nm);
        var re = raceEng[num(d.pos_in_team) || (idx + 1)];
        var end = num(d.contract_end_season);
        var status = end > 0 && end > activeSeason ? 'Contract until ' + end : (end > 0 ? '<span class="tm-expiring">Contract expiring</span>' : '');
        return '<a class="f1-dcard" href="' + driverHref(nm) + '" style="' + band.style + '">'
          + '<span class="f1-dcard__text">'
          +   '<span class="f1-dcard__first">' + esc(d.first_name) + '</span>'
          +   '<span class="f1-dcard__last">' + esc(d.last_name) + '</span>'
          +   '<span class="f1-dcard__team">' + (idx < 2 ? 'Car ' + (idx + 1) : 'Driver') + '</span>'
          +   (status ? '<span class="f1-dcard__team">' + status + '</span>' : '')
          +   '<span class="f1-dcard__num">' + (BTG.numberSlot && num2 != null ? BTG.numberSlot(num2, name, 34, '', false, idx === 0 ? 'car1' : idx === 1 ? 'car2' : 'reserve', activeSeason) : '') + '</span>'
          +   (re ? '<span class="f1-dcard__team">Engineer: ' + esc(driverName(re)) + '</span>' : '')
          +   '<span class="f1-dcard__flag">' + (BTG.flagImg ? BTG.flagImg(nationOf(nm), 20, 14, '') : '') + '</span>'
          + '</span>'
          + '<span class="f1-dcard__photo">' + BTG.driverPhotoImg(nm, 150, '', activeSeason) + '</span>'
          + '</a>';
      }).join('') + '</div>' : empty('No driver data');

    /* ===== 2. Season results ===== */
    var seasonHtml = '<div class="tm-stats">'
      + tmStat(cur.points, 'Points') + tmStat(cur.wins, 'Wins') + tmStat(cur.podiums, 'Podiums') + tmStat(cur.poles, 'Poles')
      + tmStat(cur.races, 'Races') + tmStat(cur.avgFinish, 'Avg finish') + tmStat(cur.dnfs, 'DNFs') + tmStat(cur.dsqs, 'DSQs')
      + '</div>'
      + (function () {
          if (!seasonResults.length && !seasonSprints.length) return '<div class="tm-panel">' + empty('No results yet this season') + '</div>';
          var byRace = {};
          seasonResults.concat(seasonSprints).forEach(function (r) {
            var k = String(r.race_id);
            if (!byRace[k]) {
              var race = (D.races || []).filter(function (x) { return String(x.race_id) === String(r.race_id); })[0] || {};
              byRace[k] = { race: race, points: 0, best: 99, finishes: [] };
            }
            byRace[k].points += num(r.points) + num(r.bonus_points);
            var f = num(r.finish_position);
            if (!r.isSprint && f > 0) byRace[k].finishes.push({ pos: f, name: str(r.driver_name) });
            if (f > 0 && f < byRace[k].best) byRace[k].best = f;
          });
          var rows = Object.keys(byRace).map(function (k) { return byRace[k]; })
            .sort(function (a, b) { return num(a.race.round_number) - num(b.race.round_number); });
          var out = '<div class="tm-panel tm-tablewrap"><table class="tm-table"><thead><tr>'
            + '<th>Rd</th><th>Grand Prix</th><th>Finishes</th><th class="r">Best</th><th class="r">Pts</th></tr></thead><tbody>';
          rows.forEach(function (x) {
            var c = BTG.circuitBySlug ? BTG.circuitBySlug(x.race.circuit) : null;
            var gp = c && BTG.gpNameFor ? BTG.gpNameFor(x.race.circuit, x.race.format) : (x.race.name || x.race.circuit || 'Race');
            var flag = c && c.flag ? '<img class="tm-flag" src="Flags/' + c.flag + '.svg" alt="" onerror="this.style.display=\'none\'">' : '';
            var fin = x.finishes.sort(function (a, b) { return a.pos - b.pos; }).map(function (f) {
              return '<span class="tm-fin' + (f.pos === 1 ? ' tm-fin--win' : f.pos <= 3 ? ' tm-fin--pod' : '') + '" title="' + esc(f.name) + '">P' + f.pos + '</span>';
            }).join('');
            out += '<tr><td class="tm-rd">' + num(x.race.round_number) + '</td>'
              + '<td><a class="tm-gp" href="race-weekend.html?series=' + encodeURIComponent(activeSeries) + '&season=' + encodeURIComponent(activeSeason) + '&round=' + num(x.race.round_number) + '">' + flag + esc(gp) + '</a></td>'
              + '<td>' + (fin || '—') + '</td>'
              + '<td class="r">' + (x.best < 99 ? 'P' + x.best : '—') + '</td>'
              + '<td class="r tm-strong">' + x.points + '</td></tr>';
          });
          return out + '</tbody></table></div>';
        })();

    /* ===== 3. Staff & academy ===== */
    function personRow(nm, extra) {
      var nn = driverNumber(nm);
      return '<a class="tm-person" href="' + driverHref(nm) + '">'
        + '<span class="tm-person__face">' + BTG.driverPhotoImg(nm, 40, '', activeSeason) + '</span>'
        + '<span class="tm-person__name">' + esc(nm) + (nn != null ? ' <i>#' + nn + '</i>' : '') + '</span>' + (extra || '') + '</a>';
    }
    var reservesHtml = reserves.length ? reserves.map(function (h) { return personRow(str(h.entity_name), smallStatus(h.till_year)); }).join('') : empty('No reserve drivers');
    var juniorsHtml = juniors.length ? juniors.map(function (h) { return personRow(str(h.entity_name), smallStatus(h.till_year)); }).join('') : empty('No junior drivers');
    var staffHtml = '';
    if (seriesHasStaff(activeSeries)) {
      staffHtml = nonDriver.length ? nonDriver.slice().sort(function (a, b) {
          return str(a.role_label) < str(b.role_label) ? -1 : str(a.role_label) > str(b.role_label) ? 1 : num(a.pos_in_team) - num(b.pos_in_team);
        }).map(function (s2) {
          var nm = driverName(s2);
          return '<div class="tm-person">' + staffAvatar(nm, 40)
            + '<span class="tm-person__name">' + esc(nm) + '<small>' + esc(s2.role_label) + '</small></span>'
            + untilLabel(s2.contract_end_season) + smallStatus(s2.contract_end_season) + '</div>';
        }).join('') : empty('No staff data available');
    }
    var academyHtml = '<div class="tm-cols">'
      + '<div class="tm-panel"><h3 class="tm-panel__title">Reserves</h3>' + reservesHtml + '</div>'
      + '<div class="tm-panel"><h3 class="tm-panel__title">Juniors</h3>' + juniorsHtml + '</div>'
      + (staffHtml ? '<div class="tm-panel"><h3 class="tm-panel__title">Staff</h3>' + staffHtml + '</div>' : '')
      + '</div>';

    /* ===== 4. History & records ===== */
    var historyHtml = '<div class="tm-stats">'
      + tmStat(all.points, 'Points') + tmStat(all.wins, 'Wins') + tmStat(all.podiums, 'Podiums') + tmStat(all.poles, 'Poles')
      + tmStat(all.races, 'Races') + tmStat(all.avgFinish, 'Avg finish') + tmStat(all.dnfs, 'DNFs') + tmStat(all.dsqs, 'DSQs')
      + '</div>'
      + '<div class="tm-panel"><h3 class="tm-panel__title">Team history</h3>' + tlHtml + '</div>'
      + '<div class="tm-cols">'
      +   '<div class="tm-panel"><h3 class="tm-panel__title">Season by season</h3>' + (standingsHist.length
            ? '<table class="tm-table"><thead><tr><th>Season</th><th class="r">Pos</th><th class="r">Pts</th></tr></thead><tbody>'
              + standingsHist.map(function (r) {
                  var p = num(r.position);
                  return '<tr><td>' + seasonYear(r.season_id) + (wccTitles.indexOf(r) !== -1 ? ' &#127942;' : '') + '</td>'
                    + '<td class="r tm-strong' + (p === 1 ? ' tm-red' : '') + '">P' + r.position + '</td><td class="r">' + r.points + '</td></tr>';
                }).join('') + '</tbody></table>'
            : empty('No history')) + '</div>'
      +   '<div class="tm-panel"><h3 class="tm-panel__title">Past drivers</h3>' + (pastDrivers.length
            ? '<div class="tm-chips">' + pastDrivers.slice(0, 30).map(function (nm) {
                return '<a class="tm-chip" href="' + driverHref(nm) + '">' + esc(nm) + '</a>';
              }).join('') + (pastDrivers.length > 30 ? '<span class="tm-chip tm-chip--more">+' + (pastDrivers.length - 30) + ' more</span>' : '') + '</div>'
            : empty('No past drivers')) + '</div>'
      + '</div>';

    panel.className = 'tm-view';
    panel.innerHTML = banner
      + section('Drivers', driversHtml)
      + section('Season ' + activeSeason, seasonHtml)
      + section('Staff &amp; academy', academyHtml)
      + section('History &amp; records', historyHtml);
    var back = document.getElementById('tm-back');
    if (back) back.onclick = backToGrid;

    // Enable the BorderGlow + card glow effects after rendering
    if (BTG.numberSlotHydrate) BTG.numberSlotHydrate(panel);
  }

  /* ── Small helpers ───────────────────────────────────────────────────── */
  function seasonStats(results) {
    var isDsq = function (x) {
      return /dsq|disq|excluded/i.test(str(x.status)) || /dsq|disq|excluded/i.test(str(x.dnf_reason));
    };
    // DSQ's are counted per race WEEKEND for a team: 1 or 2 cars DSQ in the
    // same race is still only 1 DSQ for the team.
    var dsqWk = {};
    results.forEach(function (x) { if (isDsq(x)) dsqWk[String(x.race_id)] = true; });
    var raced = results.filter(function (x) { return !isDsq(x); });
    // Sprints score points but are not separate race starts, so they contribute
    // to the points total through the caller and are excluded from the
    // starts/wins/podiums/poles counts here.
    var mains = raced.filter(function (x) { return !x.isSprint; });
    var points = raced.reduce(function (s, x) { return s + num(x.points) + num(x.bonus_points); }, 0);
    var wins = mains.filter(function (x) { return num(x.finish_position) === 1; }).length;
    var podiums = mains.filter(function (x) { var p = num(x.finish_position); return p >= 1 && p <= 3; }).length;
    var poles = mains.filter(function (x) { return num(x.grid_position) === 1; }).length;
    var dnfs = mains.filter(function (x) { return num(x.dnf) === 1 || /dnf/i.test(str(x.status)); }).length;
    var finishes = mains.filter(function (x) { return num(x.finish_position) > 0; }).map(function (x) { return num(x.finish_position); });
    var best = finishes.length ? Math.min.apply(null, finishes) : null;
    var sum = finishes.reduce(function (a, b) { return a + b; }, 0);
    return {
      points: points, wins: wins, podiums: podiums, poles: poles,
      dnfs: dnfs, dsqs: Object.keys(dsqWk).length, races: mains.length,
      best: best != null ? 'P' + best : '—',
      avgFinish: mains.length && finishes.length ? (sum / finishes.length).toFixed(1) : '—'
    };
  }

  function initials(name) {
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
  }

})();
</script>
