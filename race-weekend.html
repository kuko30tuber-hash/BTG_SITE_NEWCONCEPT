<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Race Weekend</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      base: "#18181b",
      "base-deep": "#0e0e12",
      "base-header": "#101014",
      "card": "#0e0e12",
      "card-hover": "#131318",
      "border-subtle": "rgba(255,255,255,0.06)",
      "border-medium": "rgba(255,255,255,0.10)",
      "border-strong": "rgba(255,255,255,0.14)",
      "primary-text": "#f4f4f5",
      "secondary-text": "#a1a1aa",
      "muted-text": "#71717a",
      "disabled-text": "#52525b",
      accent: { DEFAULT: "#dc2626", light: "#f87171", dark: "#7f1d1d", bg: "rgba(220,38,38,0.08)", border: "rgba(220,38,38,0.25)" },
    } } }
  };
</script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   BeTheGrid — Race Weekend (faithful port of TFGTools race-weekend UI)
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --bg-base: #18181b;
  --bg-card: #0e0e12;
  --bg-card-hover: #131318;
  --bg-header: #101014;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.14);
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --text-disabled: #52525b;
  --accent: #dc2626;
  --accent-light: #f87171;
  --accent-dark: #7f1d1d;
  --accent-bg: rgba(220,38,38,0.08);
  --accent-border: rgba(220,38,38,0.25);
  --accent-rgb: 220 38 38;
  --accent-light-rgb: 248 113 113;
  --accent-dark-rgb: 127 29 29;
  /* The interface-wide default for anything painted in a team's colour. A card that resolves no team takes the
     theme's own accent, so switching theme changes the fallback everywhere instead of leaving one hard-coded
     purple behind. Components that do know a team still set `--team-rgb` inline and win over this. */
  --team-rgb: 220 38 38;
  --theme-secondary: #f59e0b;
  --theme-secondary-rgb: 245 158 11;
  --base-rgb: 24 24 27;
  --deep-rgb: 14 14 18;
  --card-rgb: 14 14 18;
  --card-hover-rgb: 19 19 24;
  --raised-rgb: 19 19 24;
  --surface-raised: #131318;
  --header-rgb: 16 16 20;
  font-variant-numeric: tabular-nums;
}

/* Keep BTG nav; give page its own TFG-style background */
body {
  background: rgb(var(--base-rgb)) !important;
  color: #f4f4f5;
}
/* Viewport-pinned glows so they never cut off / repeat on long pages */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at top left, rgba(var(--accent-rgb) / 0.12), transparent 32%),
    radial-gradient(circle at 85% 12%, rgba(var(--theme-secondary-rgb) / 0.10), transparent 28%),
    linear-gradient(180deg, rgba(var(--theme-secondary-rgb) / 0.025), transparent 20%);
}

/* ── Unified panel shell (from TFG layout.css) ── */
.content-panel { background: rgb(var(--card-rgb)); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 16px; }

/* ── Race Weekend layout ── */
.rw-wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
.rw-tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,255,255,0.1); }
.rw-tab { border: none; background: transparent; color: #71717a; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
.rw-tab:hover { color: #d4d4d8; }
.rw-tab--active { color: #f87171 !important; border-bottom-color: #dc2626; }

/* ── Race Result grid (rw-result-grid from TFG BorderGlow.css) ── */
.rw-result-grid > div {
  min-width: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  height: 100%;
  padding-left: 6px;
  padding-right: 6px;
  border-right: 1px solid rgba(255, 255, 255, 0.045);
}
.rw-result-grid > div.cell-last { border-right: 0; }
/* Collapsed (0px) columns: no border, no padding so no stray lines over data */
.rw-result-grid > div.cell-hidden { border-right: 0; padding-left: 0; padding-right: 0; }
.rw-result-grid > .cell-data,
.rw-result-grid > .cell-pos { justify-content: center; text-align: center; }
.rw-result-grid > .cell-driver { justify-content: flex-start; }
.rw-result-grid > .cell-team { justify-content: flex-end; }

/* ── Starting Grid Visual (sg-* from TFG layout.css) ── */
.sg-track { position: relative; }
.sg-track__surface { display: flex; gap: 16px; max-width: 700px; margin: 0 auto; }
.sg-col { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.sg-col--right { padding-top: 26px; }
.sg-slot { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-left: 4px solid #71717a; border-radius: 8px; padding: 8px 10px; transition: background 0.15s; }
.sg-slot:hover { background: rgba(255,255,255,0.06); }
.sg-slot__pos { font-size: 18px; font-weight: 800; color: #f4f4f5; min-width: 32px; text-align: center; flex-shrink: 0; }
.sg-slot__info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sg-slot__name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-slot__team { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #a1a1aa; }
.sg-slot__num { font-size: 16px; font-weight: 800; font-family: ui-monospace, Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono', 'Roboto Mono', 'Oxygen Mono', 'Ubuntu Monospace', 'Source Code Pro', 'Fira Mono', 'Droid Sans Mono', 'Courier New', monospace; flex-shrink: 0; min-width: 28px; text-align: right; }

/* ── Race Strip (selector) ── */
.rw-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.rw-strip__btn { display: flex; align-items: center; gap: 5px; padding: 4px 10px; font-size: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,0.10); background: transparent; color: #a1a1aa; cursor: pointer; border-radius: 4px; transition: all 120ms; }
.rw-strip__btn:hover { border-color: rgba(255,255,255,0.25); color: #d4d4d8; }
.rw-strip__btn--active { background: rgba(220,38,38,0.15); border-color: rgba(248,113,113,0.40); color: #fff; }
.rw-strip__btn--future { border-color: rgba(255,255,255,0.06); color: #52525b; opacity: 0.6; }

/* Driver photo thumbnails — use local BTG photos with ? placeholder */
.rw-photo { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); flex-shrink: 0; font-size: 12px; color: #71717a; }
.rw-photo img { width: 100%; height: 100%; object-fit: cover; }

/* Team logo images */
.rw-team-logo { height: 14px; width: auto; object-fit: contain; }

/* Series logos in the formula switcher — width-clamped, overflow hidden (crop) */
.rw-series-logo { width: 40px; height: auto; display: block; flex-shrink: 0; }
.rw-switcher-btn { display: flex; align-items: center; padding: 6px 10px; cursor: pointer; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; transition: all 120ms; opacity: 0.55; overflow: hidden; }

/* Attribute bar under BTG nav */
.rw-attrib { position: fixed; bottom: 12px; right: 16px; font-size: 9px; color: #52525b; z-index: 60; font-family: var(--data-face, monospace); }
.rw-attrib a { color: #52525b; text-decoration: underline; }
.rw-attrib a:hover { color: #a1a1aa; }

/* ═══ F1-style Race Weekend ═══════════════════════════════════════════════ */
.rw-wrap { padding: 20px 24px 40px; }
.rw-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.rw-spacer { flex: 1; }
.rw-season { display: flex; align-items: center; gap: 10px; font: 700 12px 'Titillium Web', sans-serif; color: #c9c9d0; }

.rw-hero {
  position: relative; border-radius: 8px; overflow: hidden; min-height: 340px;
  background: #15151e; display: flex; align-items: flex-end;
  border: 1px solid rgba(255,255,255,.09);
}
.rw-hero__photo { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; background: center / cover no-repeat; opacity: 0; transition: opacity .35s; }
.rw-hero--full .rw-hero__photo, .rw-hero--side .rw-hero__photo { opacity: 1; }
/* HD photo: fills the banner, darkened on the left for the text */
.rw-hero--full::before {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(90deg, rgba(11,11,16,.92) 0%, rgba(11,11,16,.65) 45%, rgba(11,11,16,.15) 100%),
              linear-gradient(0deg, rgba(11,11,16,.85) 0%, rgba(11,11,16,0) 55%);
}
/* Small photo: shown at (about) its real size on the right, fading into the dark panel */
.rw-hero--side .rw-hero__photo { width: min(600px, 58%); }
.rw-hero--side::before {
  content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: min(600px, 58%); z-index: 1;
  background: linear-gradient(90deg, #15151e 0%, rgba(21,21,30,.55) 22%, rgba(21,21,30,0) 55%);
}
.rw-hero__inner { z-index: 2; }
.rw-hero--empty { min-height: 180px; }
.rw-hero__inner { position: relative; z-index: 2; padding: 32px 32px 28px; max-width: 760px; }
.rw-hero__kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 700 13px 'Titillium Web', sans-serif; text-transform: uppercase; letter-spacing: .04em; color: #fff; opacity: .9; }
.rw-tag { background: #e10600; color: #fff; border-radius: 1000px; padding: 3px 10px; font-size: 11px; letter-spacing: .03em; opacity: 1; }
.rw-hero__name {
  display: flex; align-items: center; gap: 14px; margin-top: 8px;
  font-family: 'Formula1 Wide', 'Formula1', sans-serif; font-weight: 900; text-transform: uppercase;
  font-size: clamp(26px, 4vw, 48px); line-height: 1.05; color: #fff;
}
.rw-hero__name img { height: .7em; width: auto; border-radius: 4px; border: 1px solid rgba(255,255,255,.35); }
.rw-hero__gp { margin-top: 8px; font: 700 18px 'Formula1', sans-serif; color: #fff; }
.rw-hero__facts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 18px; }
.rw-hero__facts span { display: flex; flex-direction: column; font: 400 16px 'Formula1', sans-serif; color: #fff; text-transform: uppercase; }
.rw-hero__facts b { font: 700 11px 'Titillium Web', sans-serif; color: #c9c9d0; letter-spacing: .05em; margin-bottom: 2px; }

/* Scrolling round strip */
.rw-rounds {
  display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 10px; margin: 4px 0 6px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; position: relative;
}
.rw-round {
  flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px 7px 12px;
  border: 1px solid rgba(255,255,255,.18); border-radius: 1000px; background: transparent; color: #fff; cursor: pointer;
  font: 700 12px 'Titillium Web', sans-serif; transition: background .15s, border-color .15s;
}
.rw-round:hover { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.05); }
.rw-round img { height: 13px; width: auto; border-radius: 2px; }
.rw-round__no { font-family: 'Formula1', sans-serif; font-size: 11px; color: #8e8e98; }
.rw-round--active { background: #e10600; border-color: #e10600; }
.rw-round--active:hover { background: #ff2a1f; border-color: #ff2a1f; }
.rw-round--active .rw-round__no { color: #fff; opacity: .85; }

/* Highlights */
.rw-highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 8px 0 22px; }
.rw-hl { background: #1f1f27; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; padding: 18px 20px; position: relative; overflow: hidden; }
.rw-hl::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc, #e10600); }
.rw-hl--fl { --tc: #a855f7; }
.rw-hl__label { font: 700 14px 'Formula1', sans-serif; text-transform: uppercase; color: #fff; }
.rw-hl__body { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.rw-hl__body .rw-photo { width: 56px !important; height: 56px !important; background: #303037; }
.rw-hl__who { min-width: 0; flex: 1; }
.rw-hl__name { font: 700 18px 'Formula1', sans-serif; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rw-hl__team { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 700 13px 'Titillium Web', sans-serif; }
.rw-hl__big { font: 700 28px 'Titillium Web', sans-serif; color: #fff; white-space: nowrap; }
.rw-hl__big--purple { color: #c084fc; }
.rw-hl__none { margin-top: 12px; color: #8e8e98; font-size: 14px; }
.rw-votes { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.09); display: flex; flex-direction: column; gap: 8px; }
.rw-vote { display: flex; align-items: center; gap: 10px; font: 600 13px 'Titillium Web', sans-serif; color: #c9c9d0; }
.rw-vote__pos { width: 14px; text-align: right; font-family: 'Formula1', sans-serif; font-size: 12px; color: #8e8e98; }
.rw-vote__name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; font-weight: 700; }
.rw-vote__bar { width: 90px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.rw-vote__bar i { display: block; height: 100%; }
.rw-vote__pct { width: 46px; text-align: right; font: 700 13px 'Titillium Web', sans-serif; color: #fff; }

/* Session tabs → F1 underline tabs */
.rw-tabs { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 18px; scrollbar-width: none; }
.rw-tab {
  flex: none; position: relative; border: 0; background: none; cursor: pointer;
  padding: 12px 16px; font: 400 15px 'Formula1', sans-serif; color: #c9c9d0; transition: color .15s;
}
.rw-tab:hover { color: #fff; }
.rw-tab--active { color: #fff !important; font-weight: 700; }
.rw-tab--active::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: #e10600; }

.content-panel { background: transparent; border: 0; padding: 0; }
.rw-empty { padding: 40px 0; text-align: center; color: #8e8e98; }
.rw-section-title { font: 700 18px 'Formula1', sans-serif; text-transform: uppercase; color: #fff; margin: 0 0 14px; }
.rw-results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.rw-chip { font: 600 13px 'Titillium Web', sans-serif; color: #c9c9d0; border: 1px solid rgba(255,255,255,.15); border-radius: 1000px; padding: 5px 14px; margin-bottom: 14px; }
.rw-chip b { color: #34d399; }

/* F1 results table */
.rwt-wrap { overflow-x: auto; background: #1f1f27; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; }
.rwt { width: 100%; border-collapse: collapse; font: 600 14px 'Titillium Web', sans-serif; color: #fff; min-width: 640px; }
.rwt th {
  text-align: left; padding: 14px 12px; font: 600 12px 'Titillium Web', sans-serif; color: #8e8e98;
  text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid rgba(255,255,255,.15); white-space: nowrap;
}
.rwt td { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; vertical-align: middle; }
.rwt tbody tr { transition: background .12s; }
.rwt tbody tr:hover { background: rgba(255,255,255,.04); }
.rwt tbody tr:last-child td { border-bottom: 0; }
.rwt .c-num { text-align: right; font-family: 'Formula1', sans-serif; font-weight: 400; font-size: 13px; }
.rwt th.c-num { font-family: 'Titillium Web', sans-serif; }
.rwt .c-strong { font-family: 'Titillium Web', sans-serif; font-weight: 700; font-size: 14px; }
.rwt .c-pos { width: 56px; position: relative; padding-left: 18px; }
/* team colour bar */
.rwt tbody td.c-pos::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--tc); }
.rwt-pos { font: 700 15px 'Formula1', sans-serif; }
.rwt-pos--p1 { color: #fff; }
.rwt-pos--out { font: 700 12px 'Titillium Web', sans-serif; color: #f87171; }
.rwt-driver { display: inline-flex; align-items: center; gap: 10px; }
.rwt-driver .rw-photo { width: 30px !important; height: 30px !important; background: #303037; }
.rwt-driver__name { font: 700 14px 'Formula1', sans-serif; }
.rwt-team { display: inline-flex; align-items: center; gap: 8px; color: #c9c9d0; font-weight: 600; }
.rwt-purple { color: #c084fc; }
.rwt-pole { color: #fff; font-weight: 700; }
.rwt-up { color: #34d399; }
.rwt-down { color: #f87171; }
.rwt-out td { color: #8e8e98; }
.rwt-out .rwt-driver__name { color: #c9c9d0; }

/* Starting grid: flat F1 cards */
.sg-slot { background: #1f1f27; border-color: rgba(255,255,255,.09); border-radius: 8px; }
.sg-slot__pos { font-family: 'Formula1', sans-serif; }
.sg-slot__name { font-family: 'Formula1', sans-serif; font-size: 13px; }

@media (max-width: 900px) {
  .rw-highlights { grid-template-columns: 1fr; }
  .rw-hero { min-height: 260px; }
  .rw-hero--side .rw-hero__photo, .rw-hero--side::before { width: 100%; }
  .rw-hero--side::before { background: linear-gradient(0deg, #15151e 15%, rgba(21,21,30,.6) 60%, rgba(21,21,30,.25)); }
  .rw-hero__inner { padding: 22px 20px 20px; }
}
@media (max-width: 640px) {
  .rw-wrap { padding: 14px 12px 30px; }
  .rwt { min-width: 0; font-size: 13px; }
  .rwt .c-hide-sm { display: none; }
  .rwt td, .rwt th { padding-left: 8px; padding-right: 8px; }
  .rwt .c-team { display: none; }
  .rwt-driver .rw-photo { display: none !important; }
  .rwt .c-pos { width: 40px; padding-left: 14px; }
  .rw-hl__big { font-size: 20px; }
}
@media (max-width: 1100px) { .rwt .c-hide-md { display: none; } }
</style>
