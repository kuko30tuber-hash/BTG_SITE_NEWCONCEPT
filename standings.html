<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Standings</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<style>
/* ── Standings (TFG-inspired, vanilla port) ──────────────────────────────── */
:root {
  --bg-base: #18181b;
  --bg-card: #101014;
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --border-subtle: rgba(255,255,255,0.06);
  --accent: #b91d2e;
}
body { background: var(--bg-base); color: var(--text-primary); font-variant-numeric: tabular-nums; }

.st-wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 90px; }
.st-controls {
  display: flex; align-items: center; gap: 12px; padding: 14px 0 4px;
  border-bottom: 1px solid var(--border-subtle); margin-bottom: 20px;
  flex-wrap: wrap;
}
.st-controls .series-bar { background: none; border-bottom: none; padding: 0; }
.st-controls select {
  background: #3a3a3a; color: #fff; border: 1px solid #4d4d4d; border-radius: 4px;
  padding: 6px 10px; font-size: 12px;
}
.st-controls select option { background: #3a3a3a; color: #fff; }
.st-spacer { flex: 1; }
.st-label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }

/* Two-column layout (drivers + constructors), TFG overview style */
.st-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .st-grid { grid-template-columns: 1fr; } }

.st-col {
  background: var(--bg-card); border: 1px solid var(--border-subtle);
  border-radius: 12px; overflow: hidden;
}
.st-col__head {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.st-col__title { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
.st-col__list { display: flex; flex-direction: column; }

/* Row — mirrors TFG dash-row / team-glow-row */
.st-row {
  display: flex; align-items: center; gap: 12px; padding: 9px 14px;
  border-left: 3px solid transparent; transition: border-color 200ms, background 200ms;
  cursor: pointer;
}
.st-row:hover { background: rgba(255,255,255,0.04); border-left-color: rgb(var(--team-rgb, var(--accent-rgb))) !important; box-shadow: inset 2px 0 8px rgb(var(--team-rgb, var(--accent-rgb)) / 0.12); }
.st-row + .st-row { border-top: 1px solid rgba(255,255,255,0.03); }
.st-row__pos {
  width: 24px; height: 24px; flex-shrink: 0; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
  font-size: 11px; font-weight: 700; font-family: ui-monospace, Menlo, monospace;
  background: rgba(255,255,255,0.04); color: var(--text-secondary);
}
.st-row__pos--gold { background: rgba(250,204,21,0.15); color: #fde047; border-color: rgba(250,204,21,0.35); }
.st-row__pos--silver { background: rgba(255,255,255,0.07); color: #e4e4e7; border-color: rgba(255,255,255,0.2); }
.st-row__pos--bronze { background: rgba(253,186,116,0.12); color: #fdba74; border-color: rgba(253,186,116,0.3); }
.st-row__flag { width: 18px; height: 12px; object-fit: cover; border-radius: 1px; flex-shrink: 0; }
.st-row__photo { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
.st-row__photo img { width: 100%; height: 100%; object-fit: cover; }
.st-row__num { font-size: 10px; color: var(--text-muted); font-family: ui-monospace, monospace; flex-shrink: 0; }
.st-row__name { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-row__team { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-row__pts { font-size: 12px; font-weight: 700; font-family: ui-monospace, Menlo, monospace; color: #fde047; flex-shrink: 0; }
/* A championship has a standing before it has a winner, so the row says which of the three it is. */
.st-row__state { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border: 1px solid currentColor; white-space: nowrap; flex-shrink: 0; }
.st-row__state--champion { color: #f59e0b; }
.st-row__state--clinched { color: #5eead4; }
.st-row__state--leader { color: var(--text-secondary); }
.st-row__logo { height: 16px; max-width: 70px; object-fit: contain; flex-shrink: 0; }

/* ---- TITLE PICTURE ----
 * A leader, a clinched title and a confirmed champion are three different statements, so the strip is toned
 * differently for each rather than all sharing one accent.
 */
.title-picture { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; margin-bottom: 10px; border-left: 3px solid var(--border-medium); background: rgba(255,255,255,0.02); }
.title-picture--live { border-left-color: var(--theme-secondary); }
.title-picture--settled { border-left-color: #f59e0b; background: rgba(245,158,11,0.06); }
.title-picture__headline { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.title-picture__headline--link { cursor: pointer; }
.title-picture__headline--link:hover { text-decoration: underline; }
.title-picture__headline--link:focus-visible { outline: 2px solid var(--theme-secondary); outline-offset: 2px; }
.title-picture--settled .title-picture__headline { color: #f59e0b; }
.title-picture__detail { font-size: 11px; color: var(--text-secondary); line-height: 1.45; }

/* How much of a championship table to read. */
.standings-range { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; padding: 4px 6px; border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.02); }
.standings-range__label { font-size: 9px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-right: 2px; }
/* The ways through to a related view, held apart from the range options and stacked in the order they are read. */
.standings-range__jumps { margin-left: auto; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.standings-range__jump { padding: 3px 8px; border: 1px solid var(--border-medium); background: transparent; color: var(--text-secondary); font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: color 120ms, border-color 120ms; }
.standings-range__jump:hover { color: var(--text-primary); border-color: var(--accent-border); }
.standings-range__jump:focus-visible { outline: 2px solid var(--theme-secondary); outline-offset: 2px; }

.st-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 12px; }
.st-foot { margin-top: 12px; font-size: 11px; color: var(--text-muted); }

/* View switch (Overview / Race by Race) */
.st-viewswitch { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 3px; }
.st-viewswitch button {
  background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 12px; border-radius: 6px; cursor: pointer; transition: 150ms;
}
.st-viewswitch button.active { background: var(--accent); color: #fff; }

/* Race by Race matrix */
.st-matrix-wrap { margin-top: 16px; }
.st-matrix-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
.st-matrix-toolbar .st-back { background: none; border: none; color: var(--text-secondary); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.st-matrix-toolbar .st-back:hover { color: #fff; }
.st-matrix-quali { display: flex; gap: 4px; background: rgba(255,255,255,0.04); border-radius: 6px; padding: 2px; margin-left: auto; }
.st-matrix-quali button { background: none; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.st-matrix-quali button.active { background: rgba(255,255,255,0.12); color: #fff; }
.st-matrix-scroll { overflow: auto; max-height: 72vh; }
.st-matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
.st-matrix th, .st-matrix td { border-bottom: 1px solid rgba(255,255,255,0.04); }
.st-matrix thead th {
  position: sticky; top: 0; z-index: 20; background: #141419; padding: 6px 4px; text-align: center;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);
}
.st-matrix thead th.st-matrix__driver { position: sticky; left: 0; z-index: 30; background: #141419; text-align: left; padding: 6px 10px; }
.st-matrix thead th.st-matrix__pts { position: sticky; right: 0; z-index: 30; background: #141419; color: #fde047; }
.st-matrix td.st-matrix__driver { position: sticky; left: 0; z-index: 10; background: var(--bg-card); }
.st-matrix td.st-matrix__pts { position: sticky; right: 0; z-index: 10; background: var(--bg-card); text-align: center; font-weight: 700; font-family: ui-monospace, monospace; color: #fde047; }
.st-matrix__flag { width: 16px; height: 11px; border-radius: 1px; object-fit: cover; }
.st-matrix__spacer { display: inline-block; width: 16px; height: 11px; }
.st-matrix td { padding: 3px 2px; text-align: center; }
.st-matrix .st-matrix__cell {
  display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 24px;
  border-radius: 4px; border: 1px solid rgba(255,255,255,0.06); font-weight: 700; font-family: ui-monospace, monospace; font-size: 11px; position: relative;
}
.st-matrix .st-matrix__cell--p1 { color: #fde047; background: rgba(250,204,21,0.15); border-color: rgba(250,204,21,0.35); box-shadow: inset 0 -2px 0 rgba(250,204,21,0.8); }
.st-matrix .st-matrix__cell--p2 { color: #fff; background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); box-shadow: inset 0 -2px 0 rgba(255,255,255,0.4); }
.st-matrix .st-matrix__cell--p3 { color: #fdba74; background: rgba(253,186,116,0.12); border-color: rgba(253,186,116,0.3); box-shadow: inset 0 -2px 0 rgba(253,186,116,0.5); }
.st-matrix .st-matrix__cell--pts { color: #fff; background: rgba(185,29,46,0.15); border-color: rgba(185,29,46,0.35); }
.st-matrix .st-matrix__cell--dnf { color: #f87171; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); }
.st-matrix .st-matrix__cell--off { color: var(--text-muted); background: rgba(255,255,255,0.015); border-color: rgba(255,255,255,0.04); }
.st-matrix .st-matrix__sprint {
  position: absolute; bottom: 1px; right: 2px; font-size: 7px; font-weight: 700; color: var(--accent); line-height: 1;
}
.st-matrix .st-matrix__ptsbadge {
  position: absolute; top: -4px; right: -4px; font-size: 7px; font-weight: 700; color: #fde047; background: var(--bg-card);
  border: 1px solid rgba(250,204,21,0.3); border-radius: 3px; padding: 0 2px; line-height: 1.3;
}
.st-matrix .st-matrix__dot { font-size: 9px; color: var(--text-muted); }
.st-matrix__rank {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1); font-size: 9px; font-weight: 700; background: rgba(255,255,255,0.04); color: var(--text-secondary);
}
.st-matrix__rank--gold { background: rgba(250,204,21,0.15); color: #fde047; border-color: rgba(250,204,21,0.35); }
.st-matrix__rank--silver { background: rgba(255,255,255,0.07); color: #e4e4e7; border-color: rgba(255,255,255,0.2); }
.st-matrix__rank--bronze { background: rgba(253,186,116,0.12); color: #fdba74; border-color: rgba(253,186,116,0.3); }

.tfg-attrib { position: fixed; bottom: 12px; right: 16px; font-size: 9px; color: #52525b; z-index: 60; font-family: ui-monospace, Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono', monospace; }
.tfg-attrib a { color: #52525b; text-decoration: underline; }
.tfg-attrib a:hover { color: #71717a; }

/* ═══ F1-style Standings ═══════════════════════════════════════════════════ */
.st-wrap { padding: 0 24px 40px; }
.st-controls { margin-bottom: 16px; }

/* Leader banner */
.sl-banner { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1fr) auto 340px; align-items: stretch; min-height: 300px; border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
.sl-banner__bg { position: absolute; inset: 0; z-index: -2; }
.sl-banner__bg::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.25) 1.2px, transparent 1.6px); background-size: 6px 6px;
  -webkit-mask-image: linear-gradient(90deg, transparent 20%, #000 75%); mask-image: linear-gradient(90deg, transparent 20%, #000 75%); }
.sl-banner__main { display: flex; flex-direction: column; justify-content: flex-end; padding: 26px 30px 28px; min-width: 0; }
.sl-banner__kicker { font: 700 13px 'Titillium Web', sans-serif; text-transform: uppercase; letter-spacing: .05em; }
.sl-banner__name { display: flex; flex-direction: column; margin-top: 6px; font-family: 'Formula1', sans-serif; line-height: 1.05; }
.sl-banner__name span { font-size: clamp(20px, 2.2vw, 30px); font-weight: 400; }
.sl-banner__name b { font: 900 clamp(30px, 4.2vw, 56px)/1.05 'Formula1 Wide', 'Formula1', sans-serif; text-transform: uppercase; }
.sl-banner__team { display: flex; align-items: center; gap: 8px; margin-top: 8px; font: 700 15px 'Titillium Web', sans-serif; }
.sl-banner__stats { display: flex; flex-wrap: wrap; gap: 10px 32px; margin-top: 20px; }
.sl-banner__stats div { display: flex; flex-direction: column; }
.sl-banner__stats b { font: 700 28px 'Formula1', sans-serif; }
.sl-banner__stats span { font: 700 11px 'Titillium Web', sans-serif; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }
.sl-banner__photo { display: flex; align-items: flex-end; justify-content: center; }
.sl-banner__photo img { width: auto !important; height: 290px !important; object-fit: contain; object-position: bottom; border-radius: 0 !important; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
.sl-fight { background: rgba(11,11,16,.88); color: #fff; padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.sl-fight__title { font: 700 15px 'Formula1', sans-serif; text-transform: uppercase; }
.sl-fight__rounds { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.sl-fight__rounds span { display: block; height: 100%; background: #e10600; }
.sl-fight__meta { font: 600 12px 'Titillium Web', sans-serif; color: #c9c9d0; margin-bottom: 4px; }
.sl-fight__row { display: grid; grid-template-columns: 16px 1fr 90px 56px; align-items: center; gap: 10px; font: 700 13px 'Titillium Web', sans-serif; }
.sl-fight__pos { font-family: 'Formula1', sans-serif; color: #8e8e98; }
.sl-fight__bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.sl-fight__bar i { display: block; height: 100%; border-radius: 4px; }
.sl-fight__name { font-family: 'Formula1', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl-fight__pts { text-align: right; font-family: 'Formula1', sans-serif; }
.sl-fight__team { margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.12); font: 600 13px 'Titillium Web', sans-serif; color: #c9c9d0; }
.sl-fight__team b { color: #fff; }

/* Tabs */
.sl-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 18px; scrollbar-width: none; }
.sl-tab { flex: none; position: relative; border: 0; background: none; cursor: pointer; padding: 12px 18px; font: 400 16px 'Formula1', sans-serif; color: #c9c9d0; }
.sl-tab:hover { color: #fff; }
.sl-tab.active { color: #fff; font-weight: 700; }
.sl-tab.active::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: #e10600; }
.sl-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.sl-title { font: 900 clamp(16px, 1.6vw, 22px) 'Formula1 Wide', 'Formula1', sans-serif; text-transform: uppercase; color: #fff; margin: 0; }
.sl-pills { display: flex; gap: 4px; border: 1px solid rgba(255,255,255,.18); border-radius: 1000px; padding: 4px; }
.sl-pills button { border: 0; background: none; color: #c9c9d0; cursor: pointer; border-radius: 1000px; padding: 6px 16px; font: 700 13px 'Titillium Web', sans-serif !important; letter-spacing: 0 !important; text-transform: none !important; }
.sl-pills button.active { background: #e10600; color: #fff; }

/* Tables */
.sl-tablewrap { overflow-x: auto; background: #1f1f27; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; }
.sl-table { width: 100%; border-collapse: collapse; font: 600 14px 'Titillium Web', sans-serif; color: #fff; }
.sl-table th { text-align: left; padding: 14px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: #8e8e98; border-bottom: 1px solid rgba(255,255,255,.15); white-space: nowrap; }
.sl-table td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
.sl-table tbody tr { cursor: pointer; transition: background .12s; }
.sl-table tbody tr:hover { background: rgba(255,255,255,.04); }
.sl-table tbody tr:last-child td { border-bottom: 0; }
.sl-table .r { text-align: right; }
.sl-table .c-pos { width: 60px; position: relative; padding-left: 20px; }
.sl-table tbody td.c-pos::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 4px; border-radius: 0 3px 3px 0; background: var(--tc); }
.sl-pos { font: 700 16px 'Formula1', sans-serif; }
.sl-pos--1 { color: #ff2a1f; }
.sl-driver { display: inline-flex; align-items: center; gap: 12px; }
.sl-face { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #303037; flex: none; }
.sl-face img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.sl-driver__name { font: 400 15px 'Formula1', sans-serif; }
.sl-driver__name b { font-weight: 700; }
.sl-nat, .sl-team { display: inline-flex; align-items: center; gap: 8px; color: #c9c9d0; }
.sl-nat img { border-radius: 2px; }
.sl-team--big { color: #fff; font: 700 15px 'Formula1', sans-serif; gap: 12px; }
.sl-drivers { color: #c9c9d0; }
.sl-gap { color: #8e8e98; font-family: 'Formula1', sans-serif; font-size: 13px; }
.sl-pts { font: 700 16px 'Formula1', sans-serif; }

/* Race by race: colour-coded */
.sl-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; font: 600 12px 'Titillium Web', sans-serif; color: #c9c9d0; }
.sl-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.lg--p1 { background: #f5c518; } .lg--p2 { background: #c7ccd4; } .lg--p3 { background: #c97a3a; }
.lg--pts { background: #1f7a5c; } .lg--off { background: #303037; } .lg--dnf { background: #8b1a1a; }
.lg-s, .lg-b { font: 700 10px 'Titillium Web', sans-serif; border-radius: 3px; padding: 0 4px; }
.lg-s { background: rgba(255,255,255,.15); } .lg-b { background: #0b0b10; border: 1px solid rgba(255,255,255,.3); }
.st-matrix-scroll { max-height: 75vh; background: #1f1f27; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; }
.st-matrix { font-family: 'Titillium Web', sans-serif; }
.st-matrix th, .st-matrix td { border-bottom: 1px solid rgba(255,255,255,.06); }
.st-matrix thead th, .st-matrix thead th.st-matrix__driver, .st-matrix thead th.st-matrix__pts { background: #26262e; color: #c9c9d0; font: 700 10px 'Titillium Web', sans-serif; letter-spacing: .04em; padding: 8px 4px; }
.st-matrix thead th.st-matrix__pts, .st-matrix td.st-matrix__pts { color: #fff; font-family: 'Formula1', sans-serif; }
.st-matrix td.st-matrix__driver, .st-matrix td.st-matrix__pts { background: #1f1f27; }
.st-matrix td { padding: 3px 2px; }
.st-matrix .st-matrix__cell { min-width: 34px; height: 28px; border: 0; border-radius: 4px; font: 700 12px 'Formula1', sans-serif; box-shadow: none; }
.st-matrix .st-matrix__cell--p1 { background: #f5c518; color: #1a1300; box-shadow: none; }
.st-matrix .st-matrix__cell--p2 { background: #c7ccd4; color: #15151e; box-shadow: none; }
.st-matrix .st-matrix__cell--p3 { background: #c97a3a; color: #fff; box-shadow: none; }
.st-matrix .st-matrix__cell--pts { background: #1f7a5c; color: #fff; }
.st-matrix .st-matrix__cell--off { background: #303037; color: #a1a1aa; }
.st-matrix .st-matrix__cell--dnf { background: #8b1a1a; color: #fff; font-size: 10px; }
.st-matrix .st-matrix__sprint { color: inherit; opacity: .75; font: 700 7px 'Titillium Web', sans-serif; }
.st-matrix .st-matrix__ptsbadge { background: #0b0b10; color: #fff; border-color: rgba(255,255,255,.3); font: 700 8px 'Titillium Web', sans-serif; }
.st-matrix__rank { border-radius: 6px; font-family: 'Formula1', sans-serif; }
.st-matrix__rank--gold { background: #e10600; color: #fff; border-color: #e10600; }
.st-matrix__rank--silver, .st-matrix__rank--bronze { background: #303037; color: #fff; border-color: rgba(255,255,255,.2); }

@media (max-width: 1100px) {
  .sl-banner { grid-template-columns: minmax(0, 1fr) auto; }
  .sl-fight { grid-column: 1 / -1; }
  .sl-table .c-hide-md { display: none; }
}
@media (max-width: 640px) {
  .st-wrap { padding: 0 12px 30px; }
  .sl-banner { grid-template-columns: 1fr; }
  .sl-banner__photo { order: -1; padding-top: 10px; }
  .sl-banner__photo img { height: 200px !important; }
  .sl-banner__main { padding: 16px 18px 20px; }
  .sl-table .c-hide-sm { display: none; }
  .sl-table td, .sl-table th { padding-left: 8px; padding-right: 8px; }
  .sl-table .c-pos { width: 40px; padding-left: 14px; }
}

/* Race by Race alignment: fixed slots in the driver column, fixed 3-line round headers */
.st-matrix td.st-matrix__driver, .st-matrix th.st-matrix__driver { text-align: left; padding: 4px 12px 4px 0; }
.st-matrix td.st-matrix__driver { box-shadow: inset 4px 0 0 var(--tc, transparent); }
.st-matrix__who { display: grid; grid-template-columns: 28px 26px 20px auto; align-items: center; column-gap: 8px; padding-left: 12px; }
.st-matrix th .st-matrix__who { grid-template-columns: 28px auto; }
.st-matrix .st-matrix__rank { display: inline-grid; place-items: center; width: 28px; height: 24px; border-radius: 5px; border: 0; background: #303037; color: #fff; font: 700 12px 'Formula1', sans-serif; }
.st-matrix .st-matrix__rank--lead { background: #e10600; }
.st-matrix .st-matrix__rank--head { background: none; color: #c9c9d0; font-family: 'Titillium Web', sans-serif; }
.st-matrix__face { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #303037; display: block; }
.st-matrix__face img { width: 100% !important; height: 100% !important; object-fit: cover; object-position: top; }
.st-matrix__nat { display: flex; align-items: center; justify-content: center; }
.st-matrix__nat img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }
.st-matrix__name { font: 700 13px 'Titillium Web', sans-serif; color: #fff; white-space: nowrap; }
.st-matrix th.st-matrix__round { padding: 8px 2px; vertical-align: top; min-width: 40px; }
.st-matrix__head { display: grid; grid-template-rows: 14px 14px 10px; justify-items: center; align-items: center; row-gap: 3px; }
.st-matrix__flagbox { display: flex; align-items: center; justify-content: center; height: 14px; }
.st-matrix__flagbox .st-matrix__flag { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; display: block; }
.st-matrix__code { font: 700 11px 'Titillium Web', sans-serif; letter-spacing: .03em; color: #fff; line-height: 14px; }
.st-matrix__spr { font: 700 8px 'Titillium Web', sans-serif; color: #ff2a1f; letter-spacing: .05em; line-height: 10px; }
.st-matrix thead th.st-matrix__pts { vertical-align: middle; }
</style>

<body data-page="standings">

<div class="st-wrap">
  <div class="st-controls">
    <div class="series-bar" id="series-bar" style="border:none;background:none;padding:0;"></div>
    <span class="st-spacer"></span>
    <span class="st-label">Season</span>
    <select id="season-select"></select>
  </div>

  <!-- Championship leader -->
  <section class="sl-banner" id="st-leader"></section>

  <!-- Drivers / Teams / Race by Race -->
  <div class="sl-tabs" id="view-switch" role="tablist">
    <button type="button" class="sl-tab active" data-view="drivers">Drivers</button>
    <button type="button" class="sl-tab" data-view="teams">Teams</button>
    <button type="button" class="sl-tab" data-view="race">Race by Race</button>
  </div>

  <div id="st-view-drivers">
    <div class="sl-toolbar">
      <h2 class="sl-title" id="st-drivers-title">Drivers' Championship</h2>
      <div class="sl-pills" id="st-range">
        <button type="button" class="standings-range__jump" data-range="10">Top 10</button>
        <button type="button" class="standings-range__jump active" data-range="all">All</button>
      </div>
    </div>
    <div id="st-drivers"><div class="st-empty">Loading drivers…</div></div>
  </div>

  <div id="st-view-teams" style="display:none;">
    <div class="sl-toolbar"><h2 class="sl-title" id="st-teams-title">Constructors' Championship</h2></div>
    <div id="st-teams"><div class="st-empty">Loading teams…</div></div>
  </div>

  <div id="st-race" style="display:none;">
    <div class="sl-toolbar">
      <h2 class="sl-title" id="st-race-title"></h2>
      <div class="sl-pills st-matrix-quali">

        <button type="button" data-mode="quali">Qualifying</button>

    <div class="sl-legend">
      <span><i class="lg lg--p1"></i>Win</span><span><i class="lg lg--p2"></i>2nd</span><span><i class="lg lg--p3"></i>3rd</span>
      <span><i class="lg lg--pts"></i>Points</span><span><i class="lg lg--off"></i>No points</span><span><i class="lg lg--dnf"></i>DNF</span>
      <span><b class="lg-s">S3</b>Sprint result</span><span><b class="lg-b">8</b>Points scored</span>
    </div>
    <div class="st-matrix-scroll" id="st-race-scroll">
      <div class="st-empty">Loading race-by-race…</div>
    </div>
  </div>
</div>

<!-- Driver Modal -->
<div id="driver-modal" class="modal-overlay" onclick="BTG.bgClose(event,'driver-modal')">

    <div class="modal-driver-team" id="modal-team"></div>

<script src="js/driver-numbers.js?v=20261117-yearly-style-6"></script>
<script src="js/border-glow.js"></script>
<script src="teams/f1.js?v=20261117-lineups-photos"></script>
<script src="js/circuits.js"></script>
<script src="js/roster.js"></script>

<script src="js/data-loader.js?v=20261117-profile-team-16"></script>
<script>
(function() {
  var seriesList = [], activeSeries = null, activeSeason = null, seasons = [];
  var cache = null;
  var drivers = [], teams = [];
  var standingsRange = 'all'; // 10 | 'all' — how much of the championship table to read
  var view = 'drivers'; // drivers | teams | race
  var raceMode = 'race'; // race | quali

  function hexToRgb(hex) {
    hex = String(hex || '').replace('#','');
    if (hex.length !== 6) return (BTG.readThemeRgb ? BTG.readThemeRgb() : '220 38 38');
    var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    if ([r,g,b].some(isNaN)) return (BTG.readThemeRgb ? BTG.readThemeRgb() : '220 38 38');
    return r + ' ' + g + ' ' + b;
  }

  function teamRgb(name) {
    var hex = BTG.DBCache && BTG.DBCache.teamColorHex ? BTG.DBCache.teamColorHex(name) : '';
    return hexToRgb(hex || '');
  }
  function teamColorCss(name) {
    return 'rgb(' + teamRgb(name).split(' ').join(',') + ')';
  }
  function esc(v) { return BTG.esc ? BTG.esc(v) : String(v == null ? '' : v); }

  // Build series bar + season selector (kept from the original page).
  function buildSeriesBar() {
    var bar = document.getElementById('series-bar');
    bar.innerHTML = '';
    seriesList.forEach(function (s) {
      var t = document.createElement('div');
      t.className = 'series-tab' + (s === activeSeries ? ' active' : '');
      t.style.setProperty('--series-color', BTG.seriesAccent(s));
      t.setAttribute('data-series', s);
      t.innerHTML = BTG.seriesLogoImg(s, 26);
      t.title = s;
      t.onclick = function () {
        activeSeries = s;
        seasons = BTG.Data.getSeasons(s);
        activeSeason = seasons[0] || 2026;
        rebuildSeasonSelect();
        bar.querySelectorAll('.series-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-series') === s); });
        loadStandings();
        if (view === 'race') renderRaceByRace();
      };
      bar.appendChild(t);
    });
  }

  function rebuildSeasonSelect() {
    var sel = document.getElementById('season-select');
    sel.innerHTML = '';
    seasons.forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
    sel.value = activeSeason;
    sel.onchange = function () { activeSeason = Number(this.value); loadStandings(); if (view === 'race') renderRaceByRace(); };
  }

  function setView(v) {
    view = v;
    document.querySelectorAll('#view-switch button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-view') === v); });
    document.getElementById('st-view-drivers').style.display = v === 'drivers' ? '' : 'none';
    document.getElementById('st-view-teams').style.display = v === 'teams' ? '' : 'none';
    document.getElementById('st-race').style.display = v === 'race' ? '' : 'none';
    if (v === 'race') renderRaceByRace();
  }

  function loadStandings() {
    document.getElementById('st-drivers-title').textContent = activeSeries + ' ' + activeSeason + ' Drivers\u2019 Championship';
    document.getElementById('st-teams-title').textContent = activeSeries + ' ' + activeSeason + ' Constructors\u2019 Championship';
    loadDrivers();
    loadTeams();
    renderLeader();
  }

  // ── Drivers ─────────────────────────────────────────────────────────────
  // ── Championship leader banner ──────────────────────────────────────────
  function roundsFor() {
    var sid = seasonIdFor(activeSeries, activeSeason);
    var data = cache || {};
    var races = (data.races || []).filter(function (r) { return String(r.season_id) === String(sid); });
    var done = {};
    (data.race_results || []).forEach(function (r) { done[String(r.race_id)] = true; });
    return { total: races.length, done: races.filter(function (r) { return done[String(r.race_id)]; }).length };
  }
  function renderLeader() {
    var el = document.getElementById('st-leader');
    var list = drivers || [];
    var ranked = list.filter(function (d) { return d.standings && d.standings.pos !== '—'; });
    if (!ranked.length) { el.style.display = 'none'; return; }
    el.style.display = '';
    var leader = ranked[0];
    var lp = Number(leader.standings.pts) || 0;
    var rounds = roundsFor();
    var settled = rounds.total > 0 && rounds.done >= rounds.total;
    var p2 = ranked[1];
    var gap = p2 ? lp - (Number(p2.standings.pts) || 0) : 0;
    var full = leader.fullName || leader.name;
    var band = BTG.teamBandFor ? BTG.teamBandFor(leader.team) : null;
    var ss = leader.seasonStats || {};
    var team = (teams || [])[0];
    var html = '<div class="sl-banner__bg" style="' + (band ? band.style : 'background:#303037;color:#fff') + '"></div>'
      + '<div class="sl-banner__main" style="' + (band ? 'color:' + band.ink : '') + '">'
      +   '<div class="sl-banner__kicker">' + (settled && gap > 0 ? '&#127942; ' + esc(activeSeries) + ' ' + esc(activeSeason) + ' Champion' : 'Championship leader &middot; ' + esc(activeSeries) + ' ' + esc(activeSeason)) + '</div>'
      +   '<div class="sl-banner__name"><span>' + esc(full.split(' ').slice(0, -1).join(' ')) + '</span><b>' + esc(full.split(' ').slice(-1)[0]) + '</b></div>'
      +   '<div class="sl-banner__team">' + (BTG.teamLogoImg && leader.team ? BTG.teamLogoImg(leader.team, activeSeries, 20) : '') + '<span>' + esc(leader.team || '') + '</span></div>'
      +   '<div class="sl-banner__stats">'
      +     '<div><b>' + lp + '</b><span>Points</span></div>'
      +     '<div><b>' + (p2 ? '+' + gap : '—') + '</b><span>Lead</span></div>'
      +     '<div><b>' + (ss.wins || 0) + '</b><span>Wins</span></div>'
      +     '<div><b>' + (ss.podiums || 0) + '</b><span>Podiums</span></div>'
      +   '</div>'
      + '</div>'
      + '<a class="sl-banner__photo" href="drivers.html?driver=' + encodeURIComponent(full) + '&series=' + encodeURIComponent(activeSeries) + '&season=' + encodeURIComponent(activeSeason) + '">'
      +   BTG.driverPhotoImg(full, 280, '', activeSeason) + '</a>'
      + '<div class="sl-fight">'
      +   '<div class="sl-fight__title">Title fight</div>'
      +   '<div class="sl-fight__rounds"><span style="width:' + (rounds.total ? Math.round(rounds.done / rounds.total * 100) : 0) + '%"></span></div>'
      +   '<div class="sl-fight__meta">' + rounds.done + ' of ' + (rounds.total || rounds.done) + ' rounds run' + (settled ? ' &middot; season complete' : '') + '</div>'
      +   ranked.slice(0, 4).map(function (d, i) {
            var pts = Number(d.standings.pts) || 0;
            var nm = d.fullName || d.name;
            return '<div class="sl-fight__row"><span class="sl-fight__pos">' + (i + 1) + '</span>'
              + '<span class="sl-fight__bar"><i style="width:' + (lp ? Math.max(4, pts / lp * 100) : 0) + '%;background:' + teamColorCss(d.team) + '"></i></span>'
              + '<span class="sl-fight__name">' + esc(nm.split(' ').slice(-1)[0]) + '</span>'
              + '<span class="sl-fight__pts">' + (i === 0 ? pts + ' pts' : '-' + (lp - pts)) + '</span></div>';
          }).join('')
      +   (team ? '<div class="sl-fight__team">Constructors: <b>' + esc(team.team) + '</b> &middot; ' + team.points + ' pts</div>' : '')
      + '</div>';
    el.innerHTML = html;
  }

  function loadDrivers() {
    var listEl = document.getElementById('st-drivers');
    var list = BTG.Data.buildDriverList(activeSeries, activeSeason, { includeAll: true })
      .slice().sort(function (a, b) {
        var pa = (a.standings && a.standings.pos !== '—') ? Number(a.standings.pos) : 999;
        var pb = (b.standings && b.standings.pos !== '—') ? Number(b.standings.pos) : 999;
        if (pa !== pb) return pa - pb;
        var ta = a.teamOrder != null ? a.teamOrder : 99, tb = b.teamOrder != null ? b.teamOrder : 99;
        if (ta !== tb) return ta - tb;
        return (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
      });
    if (!list.length) { drivers = []; listEl.innerHTML = '<div class="st-empty">No standings for ' + esc(activeSeries) + '.</div>'; return; }
    drivers = list;
    var shown = standingsRange === 'all' ? list : list.slice(0, standingsRange);
    var leaderPts = Number(list[0].standings && list[0].standings.pts) || 0;
    var html = '<div class="sl-tablewrap"><table class="sl-table"><thead><tr>'
      + '<th class="c-pos">Pos</th><th>Driver</th><th class="c-hide-sm">Nationality</th><th class="c-hide-sm">Team</th>'
      + '<th class="r c-hide-md">Wins</th><th class="r c-hide-md">Podiums</th><th class="r c-hide-sm">Gap</th><th class="r">Pts</th>'
      + '</tr></thead><tbody>';
    shown.forEach(function (d, i) {
      var pos = (d.standings && d.standings.pos !== '—') ? Number(d.standings.pos) : i + 1;
      var ss = d.seasonStats || {};
      var full = d.fullName || d.name;
      var pts = d.standings ? Number(d.standings.pts) || 0 : null;
      var parts = full.split(' ');
      html += '<tr data-name="' + esc(full) + '" style="--tc:' + teamColorCss(d.team) + '">'
        + '<td class="c-pos"><span class="sl-pos' + (pos === 1 ? ' sl-pos--1' : '') + '">' + (pos > 99 ? '—' : pos) + '</span></td>'
        + '<td><span class="sl-driver"><span class="sl-face">' + BTG.driverPhotoImg(full, 34, '', activeSeason) + '</span>'
        +   '<span class="sl-driver__name">' + esc(parts.slice(0, -1).join(' ')) + ' <b>' + esc(parts.slice(-1)[0]) + '</b></span>'
        +   BTG.numberSlot(d.carNumber != null ? d.carNumber : '', d.team, 20, 'sl-num', undefined, undefined, activeSeason)
        + '</span></td>'
        + '<td class="c-hide-sm"><span class="sl-nat">' + (BTG.flagImg ? BTG.flagImg(d.nation, 22, 15) : '') + '<span>' + esc(d.nation || '') + '</span></span></td>'
        + '<td class="c-hide-sm"><span class="sl-team">' + (BTG.teamLogoImg && d.team ? BTG.teamLogoImg(d.team, activeSeries, 18) : '') + '<span>' + esc(d.team || 'Privateer') + '</span></span></td>'
        + '<td class="r c-hide-md">' + (ss.wins || 0) + '</td>'
        + '<td class="r c-hide-md">' + (ss.podiums || 0) + '</td>'
        + '<td class="r c-hide-sm sl-gap">' + (pts == null ? '—' : i === 0 && pos === 1 ? 'Leader' : '-' + (leaderPts - pts)) + '</td>'
        + '<td class="r sl-pts">' + (pts == null ? '—' : pts) + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
    listEl.innerHTML = html;
    if (BTG.numberSlotHydrate) BTG.numberSlotHydrate(listEl);
    listEl.querySelectorAll('tr[data-name]').forEach(function (el) {
      el.onclick = function () { showDriverModal(el.getAttribute('data-name')); };
    });
  }

  // ── Constructors ────────────────────────────────────────────────────────
  function loadTeams() {
    var listEl = document.getElementById('st-teams');
    var list = BTG.DBCache.getTeamStandings(activeSeries, activeSeason);
    if (!list.length) { listEl.innerHTML = '<div class="st-empty">No constructors standings for ' + esc(activeSeries) + '.</div>'; return; }
    teams = list;
    var leaderPts = Number(list[0].points) || 0;
    var html = '<div class="sl-tablewrap"><table class="sl-table"><thead><tr>'
      + '<th class="c-pos">Pos</th><th>Team</th><th class="c-hide-sm">Drivers</th><th class="r c-hide-md">Wins</th><th class="r c-hide-sm">Gap</th><th class="r">Pts</th>'
      + '</tr></thead><tbody>';
    list.forEach(function (t, i) {
      var pos = Number(t.position) || i + 1;
      var mine = (drivers || []).filter(function (d) { return d.team === t.team; });
      var wins = mine.reduce(function (n, d) { return n + ((d.seasonStats && d.seasonStats.wins) || 0); }, 0);
      html += '<tr style="--tc:' + teamColorCss(t.team) + '">'
        + '<td class="c-pos"><span class="sl-pos' + (pos === 1 ? ' sl-pos--1' : '') + '">' + pos + '</span></td>'
        + '<td><span class="sl-team sl-team--big">' + (BTG.teamLogoImg ? BTG.teamLogoImg(t.team, activeSeries, 24) : '') + '<span>' + esc(t.team) + '</span></span></td>'
        + '<td class="c-hide-sm sl-drivers">' + mine.slice(0, 3).map(function (d) { return esc((d.fullName || d.name).split(' ').slice(-1)[0]); }).join(' &middot; ') + '</td>'
        + '<td class="r c-hide-md">' + wins + '</td>'
        + '<td class="r c-hide-sm sl-gap">' + (i === 0 ? 'Leader' : '-' + (leaderPts - (Number(t.points) || 0))) + '</td>'
        + '<td class="r sl-pts">' + t.points + '</td></tr>';
    });
    listEl.innerHTML = html + '</tbody></table></div>';
  }

  // ── Driver modal (same as the original index.html) ──────────────────────
  function showDriverModal(name) {
    var d = drivers.find(function (x) { return (x.fullName || x.name) === name; });
    if (!d) return;
    if (d.teamColor) {
      var _t = BTG.teamByName(d.team);
      BTG.setTeamColors(d.teamColor, _t && _t.colorSecondary);
    }
    document.getElementById('modal-name').textContent = d.name;
    document.getElementById('modal-team').textContent = (d.team || 'Privateer') + ' · ' + (d.series || activeSeries);
    document.getElementById('modal-overall').textContent = (d.careerRecord && d.careerRecord.avgFinish !== '—') ? d.careerRecord.avgFinish : '—';
    document.getElementById('modal-flag').innerHTML = BTG.driverPhotoImg(d.fullName || d.name, 48, '', activeSeason) + ' ' + BTG.flagImg(d.nation, 48, 36);
    var career = (BTG.DBCache && BTG.DBCache.driverCareer) ? BTG.DBCache.driverCareer(d.name) : [];
    document.getElementById('modal-lifetime').innerHTML = career.length
      ? career.map(function (c) {
          return '<div class="ml-series"><div class="ml-head"><span class="ml-series-logo">' + BTG.seriesLogoImg(c.series, 14) + '</span>'
            + (c.teamKeys.length ? '<span class="ml-teams">' + c.teamKeys.map(function (t) { return esc(t); }).join(' · ') + '</span>' : '')
            + (c.numbers && c.numbers.length ? '<span class="ml-nums">#' + c.numbers.join(' #') + '</span>' : '')
            + '</div><div class="ml-stats">'
            + '<span>Seasons <b>' + (c.years || '—') + '</b></span>'
            + '<span>Starts <b>' + c.starts + '</b></span>'
            + '<span>Wins <b>' + c.wins + '</b></span>'
            + '<span>Sprint <b>' + (c.sprintWins || '—') + '</b></span>'
            + '<span>Podiums <b>' + c.podiums + '</b></span>'
            + '<span>Points <b>' + c.points + '</b></span>'
            + '<span>Best <b>' + (c.bestPos ? 'P' + c.bestPos : '—') + '</b></span>'
            + '</div></div>';
        }).join('')
      : '<div class="muted">No series yet.</div>';
    var contracts = (BTG.DBCache && BTG.DBCache.contractHistory) ? BTG.DBCache.contractHistory(d.name) : [];
    document.getElementById('modal-contracts').innerHTML = contracts.length
      ? contracts.map(function (h) {
          var roleLabel = (str0(h.entity_type) === 'tp' ? 'Team Principal' : str0(h.role));
          return '<div class="mc-row' + (h.is_current ? ' current' : '') + '">'
            + '<div class="mc-team">' + esc(str0(h.team_key) || '—') + (h.is_current ? ' <span class="tag-pill">current</span>' : '') + '</div>'
            + '<div class="mc-meta">' + esc(roleLabel) + ' · ' + (h.from_year || '—') + '–' + (h.till_year || '—') + '</div>'
            + '</div>';
        }).join('')
      : '<div class="muted">No contract history.</div>';
    function str0(v) { return v == null ? '' : String(v); }
    BTG.openModal('driver-modal');
  }

  // ── Race by Race matrix (ported from the TFG standings page) ────────────
  function seasonIdFor(series, year) {
    var rs = (cache || {}).race_seasons || [];
    for (var i = 0; i < rs.length; i++) {
      if (String(rs[i].series_id) === series && Number(rs[i].year) === Number(year)) return rs[i].season_id;
    }
    // fallback: match series only if exactly one season exists
    var matches = rs.filter(function (s) { return String(s.series_id) === series; });
    if (matches.length === 1) return matches[0].season_id;
    return null;
  }

  function flagForCircuit(circuit) {
    var c = BTG.circuitBySlug ? BTG.circuitBySlug(circuit) : null;
    return c && c.flag ? 'Flags/' + c.flag + '.svg' : '';
  }
  // F1-style 3-letter round codes (unique per circuit, so two Italian or US rounds never clash)
  var ROUND_CODES = {
    Bahrain: 'BHR', Jeddah: 'KSA', AlbertPark: 'AUS', Suzuka: 'JPN', Shanghai: 'CHN', Miami: 'MIA', Imola: 'EMI',
    Monaco: 'MON', Montreal: 'CAN', Barcelona: 'ESP', RedBullRing: 'AUT', Silverstone: 'GBR', Hungaroring: 'HUN',
    SpaFrancorchamps: 'BEL', Zandvoort: 'NED', Monza: 'ITA', Baku: 'AZE', MarinaBay: 'SIN', CircuitOfTheAmericas: 'USA',
    HermanosRodriguez: 'MEX', Interlagos: 'BRA', Vegas: 'LVG', Qatar: 'QAT', YasMarina: 'ABU', Kyalami: 'RSA',
    DubaiAutodrome: 'DUB', TermasRioHondo: 'RHO', Bathurst: 'BAT', LeMans: 'LMS', Brno: 'BRN', Nurburgring: 'NUR',
    BuenosAires: 'BUE', Sonoma: 'SON', Daytona: 'DAY'
  };
  function abbrFor(circuit, name) {
    var c = BTG.circuitBySlug ? BTG.circuitBySlug(circuit) : null;
    var key = c && c.circuit ? c.circuit : circuit;
    if (ROUND_CODES[key]) return ROUND_CODES[key];
    return String(key || name || '').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase();
  }

  function renderRaceByRace() {
    var title = document.getElementById('st-race-title');
    title.textContent = activeSeries + ' ' + activeSeason + ' Race by Race';
    var sid = seasonIdFor(activeSeries, activeSeason);
    var scroll = document.getElementById('st-race-scroll');
    var data = cache || (BTG.DBCache ? BTG.DBCache.data() : null) || {};
    if (sid == null) { scroll.innerHTML = '<div class="st-empty">No races for ' + esc(activeSeries) + '.</div>'; return; }

    // 1. Calendar columns: one per race (round), in round order.
    var allRaces = (data.races || []).filter(function (r) { return String(r.season_id) === String(sid); })
      .sort(function (a, b) { return Number(a.round_number) - Number(b.round_number); });
    if (!allRaces.length) { scroll.innerHTML = '<div class="st-empty">No races yet.</div>'; return; }

    var results = (data.race_results || []).filter(function (r) { return String(r.season_id) === String(sid) || allRaces.some(function (x) { return String(x.race_id) === String(r.race_id); }); });
    var sprints = (data.race_sprints || []).filter(function (s) { return allRaces.some(function (x) { return String(x.race_id) === String(s.race_id); }); });
    var quali = (data.race_qualifying || []).filter(function (q) { return allRaces.some(function (x) { return String(x.race_id) === String(q.race_id); }); });

    // 2. Seed drivers from the standings so totals stay correct.
    var rows = BTG.Data.buildDriverList(activeSeries, activeSeason, { includeAll: true })
      .slice().sort(function (a, b) {
        var pa = (a.standings && a.standings.pos !== '—') ? Number(a.standings.pos) : 999;
        var pb = (b.standings && b.standings.pos !== '—') ? Number(b.standings.pos) : 999;
        if (pa !== pb) return pa - pb;
        var ta = a.teamOrder != null ? a.teamOrder : 99, tb = b.teamOrder != null ? b.teamOrder : 99;
        if (ta !== tb) return ta - tb;
        return (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
      });

    var colByRace = {};
    allRaces.forEach(function (r, i) { colByRace[String(r.race_id)] = i; });

    var drv = {};
    rows.forEach(function (d) {
      drv[d.name] = {
        name: d.fullName || d.name,
        team: d.team || '',
        rgb: teamRgb(d.team),
        flag: d.nation || '',
        carNum: d.carNumber != null ? d.carNumber : '',
        cells: {}, // colIdx -> { racePos, racePts, raceDnf, sprintPos, sprintPts, sprintDnf, qualiPos }
        total: (d.standings && d.standings.pts != null) ? Number(d.standings.pts) : 0,
        pos: (d.standings && d.standings.pos !== '—') ? Number(d.standings.pos) : 999
      };
    });

    // 3. Fill race + sprint cells.
    function cellFor(driverName, colIdx) {
      if (!drv[driverName]) {
        drv[driverName] = { name: driverName, team: '', rgb: (BTG.readThemeRgb ? BTG.readThemeRgb() : '220 38 38'), flag: '', carNum: '', cells: {}, total: 0, pos: 999 };
      }
      if (!drv[driverName].cells[colIdx]) drv[driverName].cells[colIdx] = {};
      return drv[driverName].cells[colIdx];
    }
    results.forEach(function (r) {
      var ci = colByRace[String(r.race_id)];
      if (ci === undefined) return;
      var cell = cellFor(r.driver_name, ci);
      cell.racePos = Number(r.finish_position);
      cell.raceDnf = Number(r.dnf) === 1 || Number(r.finish_position) >= 99;
      cell.racePts = Number(r.points || 0) + Number(r.bonus_points || 0);
    });
    sprints.forEach(function (s) {
      var ci = colByRace[String(s.race_id)];
      if (ci === undefined) return;
      var cell = cellFor(s.driver_name, ci);
      cell.sprintPos = Number(s.finish_position);
      cell.sprintDnf = Number(s.dnf) === 1 || Number(s.finish_position) >= 99;
      cell.sprintPts = Number(s.points || 0) + Number(s.bonus_points || 0);
    });
    if (raceMode === 'quali') {
      quali.forEach(function (q) {
        var ci = colByRace[String(q.race_id)];
        if (ci === undefined) return;
        var cell = cellFor(q.driver_name, ci);
        cell.qualiPos = Number(q.position);
      });
    }

    // 4. Render.
    var posMod = function (p) { return p === 1 ? 'gold' : p === 2 ? 'silver' : p === 3 ? 'bronze' : 'normal'; };
    var cellCls = function (pos, dnf, pts) {
      if (dnf) return 'st-matrix__cell--dnf';
      if (pos === 1) return 'st-matrix__cell--p1';
      if (pos === 2) return 'st-matrix__cell--p2';
      if (pos === 3) return 'st-matrix__cell--p3';
      if (pts > 0 || (pos > 0 && pos <= 10)) return 'st-matrix__cell--pts';
      return 'st-matrix__cell--off';
    };

    var html = '<table class="st-matrix"><thead><tr>'
      + '<th class="st-matrix__driver"><span class="st-matrix__who"><span class="st-matrix__rank st-matrix__rank--head">#</span><span>Driver</span></span></th>';
    allRaces.forEach(function (r) {
      var fl = flagForCircuit(r.circuit);
      // Fixed three-line stack: flag, code, SPR slot (kept empty on normal rounds) so every column lines up.
      html += '<th class="st-matrix__round" title="' + esc(r.name || r.circuit || '') + '"><span class="st-matrix__head">'
        + '<span class="st-matrix__flagbox">' + (fl ? '<img class="st-matrix__flag" src="' + fl + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '') + '</span>'
        + '<span class="st-matrix__code">' + esc(abbrFor(r.circuit, r.name)) + '</span>'
        + '<span class="st-matrix__spr">' + (Number(r.weekend_type) === 1 ? 'SPR' : '') + '</span>'
        + '</span></th>';
    });
    html += '<th class="st-matrix__pts">Pts</th></tr></thead><tbody>';

    var driverList = Object.keys(drv).map(function (k) { return drv[k]; })
      .filter(function (d) { return Object.keys(d.cells).length > 0; })
      .sort(function (a, b) { return a.pos - b.pos || b.total - a.total; });

    driverList.forEach(function (d, di) {
      // Fixed slots: position | photo | flag | name — every row lines up.
      html += '<tr><td class="st-matrix__driver" style="--tc:' + teamColorCss(d.team) + '"><span class="st-matrix__who">'
        + '<span class="st-matrix__rank' + (di === 0 ? ' st-matrix__rank--lead' : '') + '">' + (di + 1) + '</span>'
        + '<span class="st-matrix__face">' + (BTG.driverPhotoImg ? BTG.driverPhotoImg(d.name, 24, '', activeSeason) : '') + '</span>'
        + '<span class="st-matrix__nat">' + (BTG.flagImg ? BTG.flagImg(d.flag, 18, 12) : '') + '</span>'
        + '<span class="st-matrix__name">' + esc(d.name) + '</span>'
        + '</span></td>';
      allRaces.forEach(function (r, ci) {
        var cell = d.cells[ci];
        if (!cell) { html += '<td><span class="st-matrix__dot">·</span></td>'; return; }
        if (raceMode === 'quali') {
          var qp = cell.qualiPos;
          var qc = qp === 1 ? 'st-matrix__cell--p1' : qp <= 10 ? 'st-matrix__cell--pts' : 'st-matrix__cell--off';
          html += '<td><span class="st-matrix__cell ' + qc + '" style="min-width:26px;">' + (qp != null ? qp : '—') + '</span></td>';
          return;
        }
        var mainPos = cell.racePos !== undefined ? cell.racePos : cell.sprintPos;
        var mainDnf = cell.raceDnf !== undefined ? cell.raceDnf : cell.sprintDnf;
        var racePts = cell.racePts || 0, sprintPts = cell.sprintPts || 0;
        var hasSprint = cell.sprintPos !== undefined && Number(r.weekend_type) === 1;
        var totalPts = racePts + sprintPts;
        html += '<td><span class="st-matrix__cell ' + cellCls(mainPos, mainDnf, totalPts) + '">'
          + (mainDnf ? 'DNF' : (mainPos != null ? mainPos : '—'));
        if (hasSprint) {
          html += '<span class="st-matrix__sprint">' + (cell.sprintDnf ? 'S×' : 'S' + (cell.sprintPos != null ? cell.sprintPos : '')) + '</span>';
        }
        if (totalPts > 0 && !mainDnf) {
          html += '<span class="st-matrix__ptsbadge">' + totalPts + '</span>';
        }
        html += '</span></td>';
      });
      html += '<td class="st-matrix__pts">' + d.total + '</td></tr>';
    });
    html += '</tbody></table>';

    if (!driverList.length) html = '<div class="st-empty">No race-by-race data.</div>';
    scroll.innerHTML = html;
  }

  // ── Series-based border glow (same as the home page) ────────────────────
  function applyBorderGlow() {}

  // ── Boot ────────────────────────────────────────────────────────────────
  BTG.DBCache.init().then(function (dbData) {
    cache = dbData;
    if (dbData && dbData.races && dbData.races.length) {
      BTG.Data.getSeriesList = BTG.DBCache.getSeriesList;
      BTG.Data.getSeasons = BTG.DBCache.getSeasons;
      BTG.Data.buildDriverList = BTG.DBCache.buildDriverList;
    }
    BTG.Data.init().then(load).catch(function () {
      seriesList = ['F1']; activeSeries = 'F1'; seasons = [2026]; activeSeason = 2026;
      buildSeriesBar(); rebuildSeasonSelect(); loadStandings();
    });
    BTG.Data.onUpdate(load);
  });

  document.getElementById('view-switch').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    setView(b.getAttribute('data-view'));
  });
  document.querySelectorAll('.standings-range__jump').forEach(function (b) {
    b.onclick = function () {
      var r = b.getAttribute('data-range');
      standingsRange = r === 'all' ? 'all' : Number(r) || 10;
      document.querySelectorAll('.standings-range__jump').forEach(function (x) { x.classList.toggle('active', x === b); });
      loadDrivers();
    };
  });

  document.querySelectorAll('.st-matrix-quali button').forEach(function (b) {
    b.addEventListener('click', function () {
      raceMode = b.getAttribute('data-mode');
      document.querySelectorAll('.st-matrix-quali button').forEach(function (x) { x.classList.toggle('active', x === b); });
      renderRaceByRace();
    });
  });

  function load() {
    seriesList = BTG.Data.getSeriesList().map(function (s) { return s.id; });
    if (seriesList.indexOf(activeSeries) === -1) activeSeries = seriesList[0] || 'F1';
    seasons = BTG.Data.getSeasons(activeSeries);
    if (seasons.indexOf(activeSeason) === -1) activeSeason = seasons[0] || 2026;
    buildSeriesBar();
    rebuildSeasonSelect();
    loadStandings();
  }
})();
</script>
</body>
</html>
