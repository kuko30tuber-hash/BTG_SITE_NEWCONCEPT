<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Calendar</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<style>
/* ── Calendar (F1-style) ──────────────────────────────────────────────────── */
.cal-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 40px; }
.cal-controls { display: flex; align-items: center; gap: 12px; padding: 4px 0 8px; margin-bottom: 18px; flex-wrap: wrap; }
.cal-spacer { flex: 1; }
.cal-label { font-family: 'Titillium Web', sans-serif; font-size: 12px; font-weight: 700; color: #c9c9d0; }
.cal-empty { padding: 32px 0; color: #8e8e98; }

.cal-section-title {
  font-family: 'Formula1 Wide', 'Formula1', sans-serif; font-weight: 900; text-transform: uppercase;
  font-size: clamp(16px, 1.6vw, 22px); color: #fff; margin: 34px 0 16px;
}

/* Featured strip: Previous / Next / Upcoming */
.cal-feature { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cal-fslot { display: flex; flex-direction: column; min-width: 0; }
.cal-fslot__label { font-family: 'Formula1', sans-serif; font-weight: 700; font-size: 15px; color: #fff; height: 26px; }
.cal-fcard {
  position: relative; display: block; height: 300px; border-radius: 8px; overflow: hidden;
  background: #1f1f27 center / cover no-repeat; color: #fff; text-decoration: none;
  border: 1px solid rgba(255,255,255,.09); transition: transform .18s, box-shadow .18s, border-color .18s;
}
.cal-fcard::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.25) 45%, rgba(0,0,0,.8) 100%);
}
.cal-fcard:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.5); border-color: rgba(255,255,255,.3); color: #fff; }
.cal-fcard--next { border: 2px solid #e10600; }
.cal-fcard__top { position: absolute; top: 14px; left: 14px; right: 14px; }
.cal-fcard__bottom { position: absolute; bottom: 14px; left: 14px; right: 14px; }
.cal-round { font-family: 'Titillium Web', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #fff; opacity: .9; }
.cal-fcard__name { font-family: 'Formula1', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.15; margin-top: 4px; }
.cal-dates { font-family: 'Formula1', sans-serif; font-size: 13px; text-transform: uppercase; margin-top: 4px; }
.cal-fcard__gp { font-family: 'Titillium Web', sans-serif; font-size: 13px; font-weight: 600; opacity: .85; margin-top: 2px; }

/* Season grid */
.cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.cal-card {
  display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: #1f1f27;
  border: 1px solid rgba(255,255,255,.09); color: #fff; text-decoration: none;
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
.cal-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.45); border-color: rgba(255,255,255,.28); color: #fff; }
.cal-card--next { border: 2px solid #e10600; }
.cal-card__media { position: relative; height: 140px; background: #26262e center / cover no-repeat; }
.cal-card__media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.55)); }
.cal-card--done .cal-card__media { filter: saturate(.55); }
.cal-chip {
  position: absolute; z-index: 1; top: 10px; right: 10px;
  font-family: 'Titillium Web', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
  padding: 4px 10px; border-radius: 1000px; background: rgba(0,0,0,.7); color: #fff;
  display: inline-flex; align-items: center; gap: 6px;
}
.cal-chip--next { background: #e10600; }
.cal-chip--live { background: #e10600; animation: calPulse 1.6s ease-in-out infinite; }
@keyframes calPulse { 50% { opacity: .55; } }
.cal-chip img { width: 14px; height: 14px; }
.cal-card__body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.cal-card__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cal-card__name { display: flex; align-items: center; gap: 8px; font-family: 'Formula1', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; margin-top: 2px; }
.cal-card__name img, .cal-fcard__name img { width: 26px; height: 18px; object-fit: cover; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); flex: none; }
.cal-card__gp { font-family: 'Titillium Web', sans-serif; font-size: 13px; color: #c9c9d0; }
.cal-card__dates { font-family: 'Formula1', sans-serif; font-size: 12px; text-transform: uppercase; color: #fff; white-space: nowrap; }
.cal-winner {
  display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.09);
}
.cal-winner__photo { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: #303037; flex: none; }
.cal-winner__photo img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.cal-winner__label { font-family: 'Titillium Web', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #8e8e98; line-height: 1; }
.cal-winner__name { font-family: 'Formula1', sans-serif; font-weight: 700; font-size: 14px; }
.cal-winner__trophy { margin-left: auto; font-size: 16px; }

@media (max-width: 1100px) { .cal-feature { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) {
  .cal-wrap { padding: 0 14px 30px; }
  .cal-feature { grid-template-columns: 1fr; }
  .cal-fcard { height: 220px; }
  .cal-fslot__label:empty { display: none; }
}
.tfg-attrib { position: fixed; bottom: 12px; right: 16px; font-size: 9px; color: #52525b; z-index: 60; font-family: ui-monospace, Menlo, monospace; }
.tfg-attrib a { color: #52525b; text-decoration: underline; }
</style>
<link rel="stylesheet" href="css/f1-theme.css?v=8">
</head>
<body data-page="calendar">

<nav class="btg-nav" id="btg-nav"></nav>

<div class="cal-wrap">
  <div class="cal-controls">
    <div class="series-bar" id="series-bar" style="border:none;background:none;padding:0;"></div>
    <span class="cal-spacer"></span>
    <span class="cal-label">Season</span>
    <select id="cal-season"></select>
  </div>
  <div id="cal-grid">
    <div class="cal-empty">Loading calendar…</div>
  </div>
</div>

<div class="tfg-attrib">UI by <a href="https://www.patreon.com/c/TFGTools" target="_blank" rel="noopener">TFGTools</a></div>

<script src="js/common.js?v=f1-theme-4"></script>
<script src="teams/f1.js?v=tba-1"></script>
<script src="js/db-cache.js?v=20261117-profile-team-16"></script>
<script src="js/circuits.js"></script>
<script>
(function () {
  'use strict';

  var SERIES_COLORS = { F1: '#E10600', F2: '#0090FF' };
  var D = null;
  var seriesList = [];       // [{ id, name }]
  var activeSeries = 'F1';
  var seasons = [];          // [year, ...]
  var activeSeason = null;

  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function str(v) { return v == null ? '' : String(v); }
  function escAttr(v) { return str(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function colorFor(s) { return SERIES_COLORS[s] || '#8a8a8a'; }
  function seriesColor(s) {
    var row = (D && D.series || []).filter(function (x) { return str(x.series_id) === s; })[0];
    return (row && row.color) || colorFor(s);
  }
  function seriesGlow(s) {
    var row = (D && D.series || []).filter(function (x) { return str(x.series_id) === s; })[0];
    return (row && row.glow_color) || '#38bdf8';
  }
  function seriesName(id) {
    var s = (D && D.series || []).filter(function (x) { return str(x.series_id) === id; })[0];
    return (s && s.name) || id;
  }
  function dateStr(y, m, d) { return num(y) + '-' + pad(num(m)) + '-' + pad(num(d)); }
  function shift(dateStr, days) {
    var p = String(dateStr).split('-').map(Number);
    var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2] + days));
    return dateStrFmt(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  }
  function dateStrFmt(y, m, d) { return num(y) + '-' + pad(num(m)) + '-' + pad(num(d)); }
  function formatDate(dateStr) {
    var p = String(dateStr).split('-').map(Number);
    if (p.length !== 3 || !p[0]) return dateStr;
    var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return p[2] + ' ' + names[p[1] - 1] + ' ' + p[0];
  }
  function todayFor(series) {
    var rows = (D && D.app_state || []).filter(function (s) { return str(s.series) === series; });
    if (!rows.length) return null;
    var r = rows[0];
    if (num(r.year) > 0) return dateStr(r.year, r.month, r.day);
    return null;
  }
  function trackImg(circuit) {
    var c = BTG.circuitBySlug(circuit);
    return c && c.img ? 'tracks/' + encodeURIComponent(c.img) + '.webp' : null;
  }
  function flagUrl(circuit) {
    var c = BTG.circuitBySlug(circuit);
    return c && c.flag ? 'Flags/' + c.flag + '.svg' : '';
  }
  function fmtIcon(r) {
    var f = str(r.format || '').toLowerCase();
    if (num(r.weekend_type) === 1 || f === 'sprint') return '<img src="tracks/Sprint.png" alt="Sprint">';
    if (f === 'double') return '<img src="tracks/Double.png" alt="Double">';
    if (f === 'flagship') return '<img src="tracks/Flagship.png" alt="Flagship">';
    return '';
  }

  function build() {
    // Series that actually have a season + races in the DB.
    var bySeries = {};
    (D.races || []).forEach(function (r) { bySeries[str(r.season_id)] = true; });
    var seen = {};
    seriesList = [];
    (D.race_seasons || []).forEach(function (s) {
      if (!bySeries[str(s.season_id)]) return;
      if (seen[s.series_id]) return;
      seen[s.series_id] = true;
      seriesList.push({ id: str(s.series_id), name: seriesName(str(s.series_id)) });
    });
    var seriesOrder = ['F1', 'F2', 'XGT'];
    seriesList.sort(function (a, b) {
      var ai = seriesOrder.indexOf(a.id), bi = seriesOrder.indexOf(b.id);
      return (ai < 0 ? seriesOrder.length : ai) - (bi < 0 ? seriesOrder.length : bi);
    });
    if (!seriesList.length) seriesList = [{ id: 'F1', name: seriesName('F1') }];
    if (!seriesList.some(function (s) { return s.id === activeSeries; })) activeSeries = seriesList[0].id;

    var bar = document.getElementById('series-bar');
    bar.innerHTML = '';
    seriesList.forEach(function (s) {
      var t = document.createElement('div');
      t.className = 'series-tab' + (s.id === activeSeries ? ' active' : '');
      t.style.setProperty('--series-color', seriesColor(s.id));
      t.setAttribute('data-series', s.id);
      t.innerHTML = BTG.seriesLogoImg(s.id, 26);
      t.title = s.name || s.id;
      t.onclick = function () {
        activeSeries = s.id;
        rebuildSeasons();
        render();
        bar.querySelectorAll('.series-tab').forEach(function (x) {
          x.classList.toggle('active', x.getAttribute('data-series') === s.id);
        });
      };
      bar.appendChild(t);
    });

    rebuildSeasons();
    render();
  }

  function rebuildSeasons() {
    var set = {};
    var sidOf = {};
    (D.race_seasons || []).forEach(function (s) {
      if (str(s.series_id) !== activeSeries) return;
      set[num(s.year)] = true;
      sidOf[num(s.year)] = str(s.season_id);
    });
    seasons = Object.keys(set).map(Number).sort(function (a, b) { return b - a; });
    if (!seasons.length) seasons = [2024];
    if (!seasons.some(function (y) { return y === activeSeason; })) activeSeason = seasons[0];
    var sel = document.getElementById('cal-season');
    sel.innerHTML = seasons.map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join('');
    sel.value = activeSeason;
  }

  function racesFor() {
    var sid = null;
    (D.race_seasons || []).forEach(function (s) {
      if (str(s.series_id) === activeSeries && num(s.year) === num(activeSeason)) sid = str(s.season_id);
    });
    if (sid == null) return [];
    return (D.races || []).filter(function (r) { return str(r.season_id) === sid; })
      .slice().sort(function (a, b) { return num(a.round_number) - num(b.round_number); });
  }

  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  /* "06 - 08 NOV" style weekend range ending on race day (Fri–Sun). */
  function weekendRange(raceDate) {
    var end = String(raceDate).split('-').map(Number);
    if (end.length !== 3 || !end[0]) return '';
    var startStr = shift(raceDate, -2).split('-').map(Number);
    var s = pad(startStr[2]), e = pad(end[2]);
    return startStr[1] === end[1]
      ? s + ' - ' + e + ' ' + MONTHS[end[1] - 1]
      : s + ' ' + MONTHS[startStr[1] - 1] + ' - ' + e + ' ' + MONTHS[end[1] - 1];
  }
  function weekendLink(round) {
    return 'race-weekend.html?series=' + encodeURIComponent(activeSeries)
      + '&season=' + encodeURIComponent(activeSeason) + '&round=' + round;
  }

  function render() {
    var root = document.getElementById('cal-grid');
    var races = racesFor();
    if (!races.length) {
      root.innerHTML = '<div class="cal-empty">No races on the calendar for this series/season yet.</div>';
      return;
    }
    var today = todayFor(activeSeries);
    // A race with imported results is finished — the calendar advances past it
    // even before the league date ticks over (e.g. F2 Bahrain done → Jeddah next).
    var resultsByRace = {};
    var winnerByRace = {};
    (D.race_results || []).forEach(function (r) {
      resultsByRace[String(r.race_id)] = true;
      if (num(r.finish_position) === 1) winnerByRace[String(r.race_id)] = str(r.driver_name);
    });
    (D.race_sprints || []).forEach(function (s) { resultsByRace[String(s.race_id)] = true; });

    var nextIdx = -1;
    var info = races.map(function (r, i) {
      var raceDate = str(r.race_date).slice(0, 10);
      var done = !!resultsByRace[String(r.race_id)];
      if (!done && nextIdx === -1) nextIdx = i;
      var live = !done && !!today && today >= shift(raceDate, -2) && today <= raceDate;
      var circuit = str(r.circuit);
      return {
        r: r, round: i + 1, done: done, live: live, raceDate: raceDate,
        gp: circuit ? BTG.gpNameFor(circuit, r.format) : (str(r.name) || ''),
        place: (str(r.country) || str(r.name) || circuit).replace(/([a-z])([A-Z])/g, '$1 $2'),
        img: trackImg(circuit), flag: flagUrl(circuit),
        base: (BTG.circuitBySlug(circuit) || {}).img || '',
        winner: winnerByRace[String(r.race_id)] || ''
      };
    });

    function flagTag(x) {
      return x.flag ? '<img src="' + escAttr(x.flag) + '" alt="" onerror="this.style.display=\'none\'">' : '';
    }
    function bgStyle(x) { return (x.base ? ' data-track="' + escAttr(x.base) + '"' : '') + (x.img ? ' style="background-image:url(' + escAttr(x.img) + ')"' : ''); }

    /* ── Previous / Next / Upcoming ── */
    var slots = [];
    if (nextIdx >= 0) {
      // Up to 2 previous rounds, the next one, then fill the rest with upcoming rounds.
      var before = info.slice(Math.max(0, nextIdx - 2), nextIdx);
      var after = info.slice(nextIdx + 1, nextIdx + 1 + (3 - before.length));
      before.forEach(function (x) { slots.push({ label: 'Previous', x: x }); });
      slots.push({ label: 'Next', x: info[nextIdx] });
      after.forEach(function (x) { slots.push({ label: 'Upcoming', x: x }); });
    } else {
      info.slice(-4).forEach(function (x, k, arr) { slots.push({ label: k === arr.length - 1 ? 'Season finale' : 'Previous', x: x }); });
    }
    var lastLabel = '';
    var feature = '<div class="cal-feature">' + slots.map(function (sl) {
      var x = sl.x;
      var showLabel = sl.label !== lastLabel; lastLabel = sl.label;
      return '<div class="cal-fslot"><div class="cal-fslot__label">' + (showLabel ? sl.label : '') + '</div>'
        + '<a class="cal-fcard' + (sl.label === 'Next' ? ' cal-fcard--next' : '') + '" href="' + weekendLink(x.round) + '"' + bgStyle(x) + '>'
        +   '<div class="cal-fcard__top">'
        +     '<div class="cal-round">Round ' + x.round + (x.live ? ' · Live' : '') + '</div>'
        +     '<div class="cal-fcard__name">' + BTG.esc(x.place) + '</div>'
        +     '<div class="cal-dates">' + weekendRange(x.raceDate) + '</div>'
        +   '</div>'
        +   '<div class="cal-fcard__bottom"><div class="cal-fcard__gp">' + BTG.esc(x.gp) + '</div>'
        +     (x.winner ? '<div class="cal-fcard__gp">' + BTG.icon('trophy', 15) + ' ' + BTG.esc(x.winner) + '</div>' : '')
        +   '</div>'
        + '</a></div>';
    }).join('') + '</div>';

    /* ── Full season grid ── */
    var grid = '<div class="cal-grid">' + info.map(function (x) {
      var chip = x.live ? '<span class="cal-chip cal-chip--live">Live</span>'
        : (x.round - 1 === nextIdx ? '<span class="cal-chip cal-chip--next">Next race</span>'
        : (x.done ? '<span class="cal-chip">' + BTG.icon('finish', 13) + ' Finished</span>' : ''));
      var fmt = fmtIcon(x.r);
      if (fmt && !chip) chip = '<span class="cal-chip">' + fmt + ' Sprint</span>';
      var winner = x.winner
        ? '<div class="cal-winner"><span class="cal-winner__photo">' + (BTG.driverPhotoImg ? BTG.driverPhotoImg(x.winner, 34, '', activeSeason) : '') + '</span>'
          + '<span><div class="cal-winner__label">Winner</div><div class="cal-winner__name">' + BTG.esc(x.winner) + '</div></span>'
          + '<span class="cal-winner__trophy">' + BTG.icon('trophy', 20) + '</span></div>'
        : '';
      return '<a class="cal-card' + (x.done ? ' cal-card--done' : '') + (x.round - 1 === nextIdx ? ' cal-card--next' : '') + '" href="' + weekendLink(x.round) + '">'
        + '<div class="cal-card__media"' + bgStyle(x) + '>' + chip + '</div>'
        + '<div class="cal-card__body">'
        +   '<div class="cal-card__row"><span class="cal-round">Round ' + x.round + '</span><span class="cal-card__dates">' + weekendRange(x.raceDate) + '</span></div>'
        +   '<div class="cal-card__name">' + flagTag(x) + BTG.esc(x.place) + '</div>'
        +   '<div class="cal-card__gp">' + BTG.esc(x.gp) + '</div>'
        +   winner
        + '</div></a>';
    }).join('') + '</div>';

    // Swap each photo for the sharpest of that track's versions once known.
    setTimeout(function () {
      if (!BTG.bestTrackImage) return;
      root.querySelectorAll('[data-track]').forEach(function (el) {
        BTG.bestTrackImage(el.getAttribute('data-track')).then(function (best) {
          if (best) el.style.backgroundImage = 'url(' + best.url + ')';
        });
      });
    }, 0);
    root.innerHTML = feature + '<h2 class="cal-section-title">' + activeSeason + ' Season · ' + races.length + ' Rounds</h2>' + grid;
  }

  BTG.DBCache.init().then(function (data) {
    if (!data || !data.races || !data.races.length) {
      document.getElementById('cal-grid').innerHTML = '<div class="cal-empty">Calendar unavailable — no cached race data.</div>';
      return;
    }
    D = data;
    build();
  });

  document.getElementById('cal-season').addEventListener('change', function () {
    activeSeason = Number(this.value);
    render();
  });
})();
</script>
</body>
</html>
